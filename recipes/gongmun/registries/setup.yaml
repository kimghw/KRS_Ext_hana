# 공문 설정 채우기 — 공문 탭의 채팅 칸에 과제명·과제책임자 등을 붙여 넣으면(과제 목록 표를 복사한 것, 메모, 문장) 공문 설정에 얹는다
# (2026-10-07 사용자 지정). 과제책임자는 품의의 합의자다. 과제 별명은 교육·출장 품의 제목("[과제 별명] 수행을 위한 … 품의"),
# 연구기간은 본문 '과제 개요'에 들어간다(2026-10-07 사용자 지정).
# 조각은 부분 수정이다 — 말하지 않은 칸은 빠지고, 과제는 이름(또는 번호)이 같은 것을 고치고 없으면 더한다(열 개까지 — R&D 탭과 같은 한도, 2026-10-10 사용자 지정. src/gongmun.js 의 mergeSetup).
# Claude 가 닿지 않으면 규칙 해석(src/gongmun.js 의 parseSetupLocal)이 표·"책임자 ○○○" 꼴을 읽는다.
#
# 값(role·rules·read·example)은 그대로 Claude 에게 가는 지시문이다(# 주석은 사람만 본다). 키의 꼴은 reading.yaml 과 같다.
# 지시문 전문은 `node tools/gen-gongmun.mjs --prompt setup`.
role: >-
  당신은 전자결재 품의 작성 도우미입니다. 사용자가 붙여 넣은 글(과제 목록 표를 복사한 것, 메모, 문장)에서 품의의 공문 설정에 넣을 값을 뽑습니다.
  입력에는 지금 등록된 공문 설정(JSON)과 새 글이 들어 있습니다.

keys:
  - key: projects
    type: list
    max: 10
    read: 과제. 글에 나온 과제마다 한 줄 — 과제가 나오지 않았으면 null
    item:
      - { key: name, required: true, max: 200, read: 과제명(글에 적힌 그대로 — 전자결재 과제 찾기에 그대로 쓴다), example: MW급 10kV 고전압 직류 시스템용 반도체 차단기 개발 }
      - { key: code, max: 40, read: 과제번호, example: RND-20-2026 }
      - { key: lead, max: 40, read: 과제책임자 이름 — 품의의 합의자가 된다, example: 박기도 }
      - { key: alias, max: 60, read: '과제 별명(약칭·줄임말) — 글에 "별명"·"약칭" 으로 적혀 있을 때만. 교육·출장 품의 제목 "<별명> 수행을 위한 … 품의" 에 들어간다', example: 차단기 과제 }
      - { key: period, max: 60, read: 연구기간 — 글에 적힌 그대로. 본문 과제 개요에 들어간다, example: 2026.04.01 ~ 2029.12.31 }
      - { key: about, max: 300, read: '과제 개요 — 글에 과제의 목적이 적혀 있을 때만. "…을 수행하고 있습니다" 로 끝나는 한 구절(본문 첫 줄에 들어간다)' }
      - { key: content, max: 3000, read: 과제 내용 — 연구목표·연구내용·과제 설명을 글에 적힌 그대로(품의 사유를 쓰는 근거가 된다) }
  - { key: dept, max: 100, read: 기안 부서, example: 연구본부 수소전기추진연구팀 }
  - { key: lead, max: 40, read: 과제를 말하지 않고 과제책임자(합의자)만 적었을 때 그 이름 — 입력의 "지금 고른 과제"의 합의자가 된다 }
  - { key: content, max: 3000, read: 과제를 말하지 않고 과제 내용(연구목표·연구내용)만 붙여 넣었을 때 그 글 — 입력의 "지금 고른 과제"의 내용이 된다 }
  - { key: alias, max: 60, read: 과제를 말하지 않고 과제 별명만 적었을 때 그 별명 — 입력의 "지금 고른 과제"의 별명이 된다 }
  - { key: period, max: 60, read: 과제를 말하지 않고 연구기간만 적었을 때 그 기간 — 입력의 "지금 고른 과제"의 연구기간이 된다 }
  - { key: head, max: 40, read: 부서장 이름(품의의 결재자), example: 노길태 }
  - { key: refs, max: 300, read: 참조자 이름들 — 쉼표로 나눈 전체 목록, example: '홍길동, 이몽룡' }
  - { key: reply, max: 300, read: 무엇을 채웠는지 한국어 한 문장 }

rules:
  - 글에 적힌 것만 채웁니다. 적혀 있지 않은 값은 null 이고, 추측하거나 지어내지 않습니다.
  - 사람 칸(lead·head·refs)에는 이름만 적습니다 — 직급·직책(수석·책임·선임·팀장·PI 등)과 존칭은 뗍니다("박기도 책임" → "박기도").
  - '"책임자"·"연구책임자"·"과제책임자"·"PI"·"합의자"·"합의" 로 적힌 사람은 그 과제의 lead 입니다. "부서장"·"팀장"·"결재" 로 적힌 사람은 head, "참조" 로 적힌 사람들은 refs 입니다.'
  - 표를 복사한 글이면 줄마다 과제 하나입니다. 과제명·과제번호·책임자 칸을 가려 넣고, 머리글 줄(과제명·책임자 같은 제목만 있는 줄)은 과제가 아닙니다.
  - 지금 등록된 과제와 이름(또는 번호)이 같은 과제는 같은 과제입니다 — 그 과제의 이름을 그대로 적고 바뀐 칸만 채웁니다.
  - refs 는 참조자 전체 목록입니다. 지금 등록된 참조자에 더하라고 했으면 그들도 함께 적고, 바꾸라고 했으면 새 목록만 적습니다.
  - 과제는 열 개까지 등록합니다. 글에 그보다 많으면 처음 열 개만 적고 reply 에 그 사실을 적습니다.
  - '과제를 말하지 않고 "합의자 ○○○"·"책임자 ○○○" 처럼 사람만 적었으면 projects 는 null 이고 lead 에 그 이름을 적습니다. 과제를 말했으면 lead 는 null 입니다(그 과제 줄의 lead 에 적습니다).'
  - 과제 내용(연구목표·연구내용·과제 설명)은 요약하지 않고 글에 적힌 그대로 content 에 옮깁니다. 과제를 말했으면 그 과제 줄의 content 에, 과제 없이 내용만 붙여 넣었으면 바깥 content 에 적습니다.
  - '"별명"·"약칭"·"줄여서" 로 적힌 짧은 이름은 alias, "연구기간"·"과제기간"·"기간" 으로 적힌 기간은 period 입니다. 과제명을 줄여 별명을 지어내지 않습니다. 과제를 말했으면 그 과제 줄에, 과제 없이 적었으면 바깥 alias·period 에 적습니다.'
  - reply 에는 무엇을 채웠는지만 한 문장으로 적습니다("과제 2개와 합의자를 채웠습니다").
