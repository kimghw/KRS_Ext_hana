# 문서 읽기 — 공통. 공문 탭에 넣은 문서(캡처·끌어다 놓은 그림·PDF·붙여 넣은 글·웹페이지 캡처의 화면 글자)를 Claude 가 읽을 때 주는
# 지시문 가운데 갈래(구매·교육·출장·외부활동)와 무관한 부분이다. 갈래만의 칸과 읽는 법은 purposes/<목적>/purpose.yaml 의 fields·reads·reading 에 있다.
#
# 값(role·rules·read·example)은 그대로 Claude 에게 가는 지시문이다(인라인 프롬프트). # 주석은 사람만 본다 — Claude 는 보지 못한다.
# 고친 뒤 `npm run gen`(또는 `node tools/gen-gongmun.mjs`)을 돌리면 확장이 새 지시문으로 읽는다.
# Claude 가 받는 지시문 전문은 `node tools/gen-gongmun.mjs --prompt <갈래>`(purchase·edu·trip·outside)로 본다.
#
# 지시문은 이 차례로 붙는다:
#   role → 출력 키(before · 갈래의 fields(from: document)·reads · quote_area · after — 키마다 read 와 example) → rules → 갈래의 reading.rules
#
# 키의 꼴은 purpose.yaml 의 fields 와 같다(머리말은 research-form/forms/research_task/purposes/purchase/purpose.yaml).
#   required: true 인 키는 꼭 있어야 한다 — 없거나 틀린 답은 통째로 버리고 다음 길(로컬 CLI → API 키)로 내려간다.

# {품의} 는 갈래의 title(구매품의 …), {문서} 는 갈래의 reading.docs 로 바뀐다.
role: >-
  당신은 사내 연구부서의 전자결재 품의 작성 도우미입니다. 첨부한 문서({문서} 등의 이미지나 PDF) 또는 붙여 넣은 글을 읽어
  {품의}에 넣을 값을 뽑습니다.

# 갈래의 칸보다 앞에 오는 키.
before:
  - key: docType
    type: choice
    required: true
    options: [quote, statement, order, course, event, request, other, unknown]
    read: >-
      문서 종류. quote(견적서)·statement(거래명세서·청구서·인보이스)·order(쇼핑몰 주문서·장바구니·상품 화면)·course(교육 안내문·교육 신청
      확인서)·event(행사·회의·학회 안내문·초청장·출장 일정표)·request(강의·자문·심사·발표·위원 위촉 등 외부활동 요청 공문·요청 메일)·other(그 밖)·unknown(모름)
    # 화면이 읽은 문서의 머리에 부르는 이름("견적서 · OO상사 · 2026-10-01") — Claude 에게는 가지 않는다.
    names: { quote: 견적서, statement: 거래명세서, order: 주문 화면, course: 교육 안내문, event: 행사 안내문, request: 요청 공문, other: 문서, unknown: 문서 }

# 갈래의 칸 뒤에 오는 키.
after:
  - key: currency
    type: choice
    options: [KRW, USD, EUR, JPY, CNY, GBP]
    read: 금액의 화폐(ISO 세 글자 코드)
    example: KRW
  # 첨부 목록의 이름은 갈래의 attach_rules.yaml parts 가 정한다(같은 kind 라도 갈래마다 이름이 다르다).
  - key: parts
    type: list
    max: 10
    read: 파일. 첨부한 파일마다 무슨 문서인지 — 공문의 첨부 목록이 된다. 글만 붙여 넣었으면 null
    item:
      - { key: file, required: true, max: 200, read: 파일 이름(입력에 적힌 그대로) }
      - key: kind
        type: choice
        required: true
        options: [quote, statement, order, course, content, event, request, other]
        read: >-
          quote(견적서)·statement(거래명세서·청구서)·order(주문 화면·예약 내역)·course(교육 안내문·신청 확인서)·content(교육 내용·커리큘럼·강의
          계획·행사 일정·외부활동 자료)·event(행사·회의·학회 안내문·초청장)·request(외부활동 요청 공문·요청 메일·위촉장)·other(그 밖)
  - key: summary
    required: true
    max: 200
    read: 무엇의 어떤 문서인지 한국어 한 줄
    example: OO상사 모니터 외 1건 견적서 989,000원

# 견적서 오리기(src/quotecut.js) — 갈래의 purpose.yaml 에 quote_crop 이 있을 때만 그 갈래의 출력 키에 더해진다.
# 지시문은 아래 read 뒤에 갈래의 quote_crop(오리는 때·꼭 들어갈 것·넣지 않을 것·잡는 법)이 붙는다.
quote_area:
  key: quoteArea
  type: list
  max: 4
  # 첫 마디(첫 마침표 앞)는 화면이 이 키를 부르는 이름이 된다 — "견적서로 오릴 칸 중 2줄은 받을 수 없어 뺐습니다".
  read: >-
    견적서로 오릴 칸. 가격과 그 둘레가 함께 든 칸을 그림마다 한 줄, 그림의 % 로 적습니다 — 이 칸을 오려 공문의 견적서로 첨부합니다.
    첨부한 문서에 견적서·거래명세서 양식이 있거나, 가격이 든 것이 PDF 이거나, 글만 붙여 넣었으면 null 입니다.
  item:
    - { key: file, required: true, max: 200, read: 그림 파일 이름(입력에 적힌 그대로) }
    - { key: left, type: number, required: true, max: 100, read: 칸의 왼쪽 끝 — 그림 폭의 %(0 이 왼쪽 끝) }
    - { key: top, type: number, required: true, max: 100, read: 칸의 위쪽 끝 — 그림 높이의 %(0 이 맨 위) }
    - { key: right, type: number, required: true, max: 100, read: 칸의 오른쪽 끝 — 그림 폭의 %(100 이 오른쪽 끝) }
    - { key: bottom, type: number, required: true, max: 100, read: 칸의 아래쪽 끝 — 그림 높이의 %(100 이 맨 아래) }

# 모든 갈래에 같이 가는 규칙.
rules:
  - 문서에 적힌 것만 채웁니다. 적혀 있지 않은 값은 null 이고, 추측하거나 지어내지 않습니다. 키의 설명이 "없으면 … 적습니다" 라고 한 키만 예외입니다.
  - 금액은 쉼표·통화 기호 없이 숫자만 적습니다. 날짜는 YYYY-MM-DD 입니다.
  - 첨부한 파일이 여러 개면 같은 건의 문서들입니다(견적서 여러 쪽, 견적서와 교육 내용 캡처 등). 값은 모두를 함께 보고 채우고, parts 에 파일마다 무슨 문서인지 적습니다.
  - 품의에 넣을 문서가 아닌 화면(결재 화면·이 프로그램의 화면·메일 목록 등)이면 docType 은 unknown 이고 나머지 값은 null 이며, summary 에 무슨 화면인지 적습니다.
