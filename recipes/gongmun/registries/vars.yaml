# 틀의 공통 자리 — 모든 갈래의 제목·본문 틀에 쓰는 {이름}. 공문 설정·고른 과제·첨부 목록에서 온다(src/gongmun.js 의 varsFor 가 채운다).
# 갈래만의 자리(교육기간·합계 …)는 purposes/<목적>/body_spec.yaml 의 vars 에 있다.
#
# 여기서는 뜻만 고친다 — 패널의 양식 칸 아래 '틀에 쓰는 이름'에 보이는 말이다. 자리를 더하거나 빼려면 코드도 고쳐야 해서 생성기가 막는다.
common:
  부서: 공문 설정의 부서
  기안자: 내 이름
  과제명: 고른 과제
  과제별명: 고른 과제의 별명 — 제목에 쓴다(비면 과제명)
  과제번호: 고른 과제의 번호
  연구기간: 고른 과제의 연구기간 — 과제에 적힌 그대로
  과제책임자: 고른 과제의 책임자(합의자)
  과제개요: 과제 개요(비면 「과제명」 과제를 수행하고 있습니다)
  계정: 계정 — 초안의 계정 칸, 비면 과제의 계정, 그것도 없으면 갈래의 기본 계정
  오늘: 오늘 날짜 — 2026. 10. 9.
  첨부: 첨부 목록 — 읽은 문서마다 한 줄, 마지막 줄에 끝.
