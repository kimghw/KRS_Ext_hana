# 문서설정 — eclass 전자결재 툴바의 '문서설정' 창에 넣는 값. 레시피의 purpose.yaml 이 document_setting 으로 프로파일 이름을 가리킨다.
#
# 원본: krs-web-agents references/공문_문서설정.md · ea_setting.yaml(연구품의 = 보존년한 10년 · Doc No. 기안 팀 채번 · 수신 내부결재).
# 겹쳐 쓰는 차례: defaults < profiles.<이름> < 패널에서 이 공문에만 바꾼 값(뒤가 이긴다).
# 문서설정 창의 선택지는 영어 이름이라(예: '10 Years') 값 코드로 적는다 — 아래 options 가 코드와 화면 이름의 표다.
# 문서설정을 넣지 않으면 서버 기본값이 남는다 — Doc No. 가 (1000)Quality Management Team 으로 잡힌다(2026-10-08 실측). 그래서 늘 넣는다.

defaults:
  retention: '120'        # 보존년한 — options.retention 의 코드
  doc_no: team            # Doc No.(채번 부서) — team 이면 기안 팀 코드(공문 설정의 '문서번호 부서', 비면 teams 표에서 부서 이름으로)
  receiver: 내부결재      # 수신처 — 내부결재 | KRE (부서 수신은 아직 넣지 않는다)
  scope: 결재선           # 공개범위 — options.scope
  emergency: false        # 긴급
  approving_open: false   # 진행공개
  drm: false              # DRM
  tag: ''                 # 검색 키워드

profiles:
  연구품의: {}            # 연구업무추진품의 — 기본값 그대로(10년 · 기안 팀 채번 · 내부결재)

# 한글 팀 이름 → Doc No. 코드(문서설정 창 ddlDocNo 의 값). 화면에는 '(8100)Hydrogen & Electric Propulsion Research Team' 처럼 영어로 보인다.
# 결재선 창 조직도의 한글 팀 이름과 아래 doc_no_options 의 영문 이름을 맞춘 것이다(연구본부 다섯 팀, 2026-10-09). 여기 없는 팀은 패널의 공문 설정이
# doc_no_options 에서 고르게 한다(부서 글에 맞는 영문 이름이 하나면 그것, 둘 이상이거나 없으면 목록에서 고름).
teams:
  수소전기추진연구팀: '8100'
  대체연료기술연구팀: '7600'
  시스템안전연구팀: '7700'
  연구지원팀: '7800'
  자율운항선박연구팀: '8200'

# 문서설정 창 ddlDocNo 의 전체 목록(코드 → 화면의 영문 이름, 2026-10-08 새 연구업무품의서 창에서 캡처). 완료한 문서의 문서설정 화면에는 Doc No. 가
