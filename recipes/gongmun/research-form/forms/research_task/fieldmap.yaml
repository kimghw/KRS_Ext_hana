# 연구업무추진품의의 칸 지도 — 새 공문 창(DocumentView)의 본문 틀(frameDocument, Forms/Drafts/KR_EA_Research_Task.aspx)에 있는 칸.
# 실측: 2026-10-08 CDP 로 연 빈 연구업무품의서(읽기만) · krs-web-agents ea_core/doc.py · ApprovalInPrinciple vendor/ea_writer/fieldfill.py.
#
# kind: text    — 글 칸. value(와 value 속성 — 양식의 검사가 속성을 읽는다)를 넣고 input·change 를 보낸다.
#       title   — 제목. text 와 같고, label 이 있으면 그 표시줄에도 글로 적는다(페이지의 SetDocumentSubject_Master 는 innerHTML 로 넣어 쓰지 않는다).
#                 max 는 실제 문서가 잘린 길이(99자, ApprovalInPrinciple 실측).
#       picker  — 과제(JOB-ID). 목록(list)을 받아 과제명이 같은 줄을 고르고, 팝업이 하던 대로 callback 을 부른다.
#                 결과는 숨은 칸(hidden)에 Project_ID(RND00202026 꼴)로 남는다. 과제명이 같은 줄이 없으면 고르지 않는다(첫 줄로 넘어가지 않는다).
#       dext5   — 본문 편집기(DEXT5). 본문 틀의 전역 함수 <control>_SetHTMLBody 로 넣고 <control>_GetTextBody 로 다시 읽는다
#                 (저장 뒤에도 남는 길 — ApprovalInPrinciple references/realeanet_dext5.md. DEXT5.setBodyValue·innerHTML 은 저장되지 않는다).
# source 는 공문의 어느 값을 넣는가 — title·recipient·reference·degree·job·body.
anchor: '#ctl00_ApplineInfoInReportKRTA1_txtDocTitle'
fields:
  title:
    kind: title
    selector: '#ctl00_ApplineInfoInReportKRTA1_txtDocTitle'
    label: '#ctl00_ApplineInfoInReportKRTA1_lblDocTitle'
    max: 99
    source: title
  recipient:
    kind: text
    selector: '#ctl00_ContentPlaceHolder_Content_txtRecieve'
    source: recipient
  reference:
    kind: text
    selector: '#ctl00_ContentPlaceHolder_Content_txtReference'
    source: reference
  degree:
    kind: text
    selector: '#ctl00_ContentPlaceHolder_Content_txtDegree'   # 차수(년차) — 단년도 과제는 '1'
    source: degree
  job:
    kind: picker
    hidden: '#ctl00_ContentPlaceHolder_Content_hidJobID'
    label: '#ctl00_ContentPlaceHolder_Content_lblJobID'
    callback: callBackReturnFromDialog    # 팝업(RnDPMS Get_PMSJobID.aspx)의 더블클릭이 opener 에 부르는 함수 — 'ID|과제명|시작|끝|부서|책임자|책임자ID'
    list: /RnDPMS/View/PMS/ListJSON_Ver2.ashx
    source: job
  body:
    kind: dext5
    control: ctl00_ContentPlaceHolder_Content_EditorControl1
    source: body
