# 구매 품의의 첨부 — 무엇을 넣으라고 하고, 읽은 파일을 어떤 문서로 부르는가.
doc: 견적서                              # 문서 없이 쓸 때의 첨부 한 줄
ask: 견적서를 넣으세요                    # 문서 넣는 곳의 말
more: 견적서 다음 쪽·거래명세서 더 넣기     # 이미 읽은 초안에 더 넣을 때의 말
need: []                                 # 꼭 드는 문서 — 본문 ※ 첨부에 늘 적고, 빠지면 "남은 것"이 짚는다
# 읽기(input.yaml gongmun 의 parts.kind)가 가린 종류 → 첨부 목록의 이름
parts:
  quote: 견적서
  statement: 거래명세서
  order: 주문 내역
  course: 강의 내용
  content: 강의 내용
  other: 참고 자료
# 첨부 파일 이름(견적서_<이 칸의 값>_날짜.pdf)과 읽은 문서의 머리(견적서 · <이 칸의 값> · 견적일)에 붙일 초안 칸 — purpose.yaml 의 fields key
who: vendor
