# 구매 품의의 제목·본문 틀. 패널의 '양식' 칸에서 보이는 기본 양식이 이것이다(고친 것은 브라우저에 따로 남고 '기본 양식으로'가 여기로 되돌린다).
# 틀의 꼴: {이름}(비면 [이름]) · {이름:은}(받침에 맞는 조사) · {이름?}(비면 그 줄을 뺌) · {차례}(가·나·다…) · {세부차례}((1)·(2)…)
#         · {{#품목}} … {{/품목}}(품목마다) · {첨부}(첨부 목록). 구매는 과제 개요를 빼는 lean 목적이다(원본 body_spec.yaml 의 skip).
# 틀에 쓴 {이름} 은 아래 vars·lists 나 공통 자리(registries/vars.yaml)에 있어야 한다 — 없는 이름(오타)은 생성기가 막는다.
title: '{품목요지} 구매 품의'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 {요약} 아래와 같이 품의하오니 재가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 구매 내역
  {{#품목}}
      ({번호}) 구매품 : {품목명}
          - 사양 : {사양?}
          - 수량 : {수량?}
          - 금액 : {금액?}
  {{/품목}}
  {차례}. 구매금액 : {합계} (VAT 포함)
  {차례}. 구매처 : {업체}
  {차례}. 구매계정 : {계정}
  {차례}. 용도 : {용도}
  {차례}. 구매사유 : {구매사유}

  ※ 첨 부
  {첨부}

# 이 목적만의 자리 — {이름} 에 초안의 어느 칸이 어떤 꼴로 들어가는가. desc 는 양식 칸 아래 '틀에 쓰는 이름'에 보인다. (다른 갈래의 body_spec.yaml 도 이 꼴이다)
#   from  초안의 칸 — purpose.yaml 의 fields·reads 의 key. 두 칸을 함께 쓰면 [시작, 끝]
#   show  text    그대로(기본)
#         won     원 — 989,000원
#         date    공문 날짜 — 2026. 10. 1.
#         period  기간과 날수 — 2026. 11. 3. ~ 2026. 11. 5. (3일) · 하루면 2026. 11. 3. (1일)   (from 이 [시작, 끝])
#         count   목록의 줄 수 — 2
#         qty     수량과 단위 — 2대   (from 이 [수량, 단위])
#   or    칸이 비면 대신 넣을 것 — me(내 이름)
vars:
  품목요지: { from: gist, desc: 제목에 쓸 품목 이름 }
  요약: { from: summary, desc: …을 구매하고자 }
  업체: { from: vendor, desc: 구매처 }
  견적일: { from: quoteDate, show: date, desc: 견적일 — 2026. 10. 1. }
  합계: { from: total, show: won, desc: 합계 — 989,000원 }
  용도: { from: use, desc: 용도 }
  구매사유: { from: reason, desc: 구매사유(과제 내용으로 쓴다) }
  품목수: { from: items, show: count, desc: 품목 수 }

# 목록 — {{#이름}} … {{/이름}} 을 목록의 줄마다 되풀이한다. 안에서는 아래 vars 와 {번호}(1·2…)를 쓴다. vars 의 from 은 줄(item)의 키다.
lists:
  품목:
    from: items
    desc: 품목마다 되풀이
    vars:
      품목명: { from: name }
      사양: { from: spec }
      수량: { from: [qty, unit], show: qty }
      단위: { from: unit }
      단가: { from: unitPrice, show: won }
      금액: { from: amount, show: won }
