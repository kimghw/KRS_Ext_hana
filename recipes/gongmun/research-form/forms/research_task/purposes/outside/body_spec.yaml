# 외부활동 허가 신청서의 제목·본문 틀 — 꼴(틀·vars·show)은 purchase/body_spec.yaml 머리말과 같다.
# 제목은 "[요청 기관] [활동구분] 외부활동 허가 신청"(과제 별명을 쓰지 않는다 — 활동이 과제 수행 자체는 아니다).
# 본문은 과제 개요 뒤에 '나. 외부활동 내용'(구분·요청기관·활동명·기간·시간·장소·내용·활동자·사례비·목적·사유)이다.
title: '{요청기관} {활동구분} 외부활동 허가 신청'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 {요청기관}의 요청으로 아래와 같이 외부활동({활동구분})을 하고자 하오니 허가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 과제 개요
      {세부차례} 과 제 명 : {과제명}
      {세부차례} 과제번호 : {과제번호?}
      {세부차례} 연구기간 : {연구기간?}
      {세부차례} 과제책임자 : {과제책임자?}
  {차례}. 외부활동 내용
      {세부차례} 활동구분 : {활동구분}
      {세부차례} 요청기관 : {요청기관}
      {세부차례} 활 동 명 : {활동명}
      {세부차례} 활동기간 : {활동기간}
      {세부차례} 활동시간 : {활동시간?}
      {세부차례} 활동장소 : {활동장소}
      {세부차례} 활동내용 : {활동내용?}
      {세부차례} 활 동 자 : {활동자}
      {세부차례} 사 례 비 : {사례비?}
      {세부차례} 활동목적 : {활동목적}
      {세부차례} 신청사유 : {신청사유}

  ※ 첨 부
  {첨부}
vars:
  활동구분: { from: type, desc: 강의·자문·심사·평가·발표·위원 활동·집필·기타 — 활동 구분 칸 }
  요청기관: { from: org, desc: 요청 기관 }
  활동명: { from: subject, desc: 활동명(강의 제목·자문 주제) }
  활동기간: { from: [from, to], show: period, desc: '시작일 ~ 종료일(며칠) — 2026. 11. 5. (1일)' }
  활동시간: { from: hours, desc: 활동시간 }
  활동장소: { from: place, desc: 활동장소 }
  활동내용: { from: topics, desc: 활동 내용 }
  활동자: { from: who, or: me, desc: 활동자(비면 내 이름) }
  사례비: { from: fee, show: won, desc: 사례비 — 300,000원 }
  활동목적: { from: purpose, desc: 활동목적 }
  신청사유: { from: reason, desc: 신청사유(과제 내용으로 쓴다) }
