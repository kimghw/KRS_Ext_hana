# 출장 품의의 제목·본문 틀 — 꼴(틀·vars·show)은 purchase/body_spec.yaml 머리말과 같다.
title: '{과제별명} 수행을 위한 출장 품의'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 {출장목적:을} 위하여 아래와 같이 출장하고자 하오니 재가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 과제 개요
      {세부차례} 과 제 명 : {과제명}
      {세부차례} 과제번호 : {과제번호?}
      {세부차례} 연구기간 : {연구기간?}
      {세부차례} 과제책임자 : {과제책임자?}
  {차례}. 출장 내용
      {세부차례} 출 장 지 : {출장지}
      {세부차례} 출장기간 : {출장기간}
      {세부차례} 출 장 자 : {출장자}
      {세부차례} 출장목적 : {출장목적}
      {세부차례} 출장사유 : {출장사유}
      {세부차례} 예상경비 : {예상경비}
      {세부차례} 예산계정 : {계정}

  ※ 첨 부
  {첨부}
vars:
  출장지: { from: place, desc: 출장지 }
  출장기간: { from: [from, to], show: period, desc: '시작일 ~ 종료일(며칠) — 2026. 10. 20. ~ 2026. 10. 21. (2일), 하루면 2026. 10. 20. (1일)' }
  출장자: { from: who, or: me, desc: 출장자(비면 내 이름) }
  출장목적: { from: purpose, desc: 출장목적 }
  출장사유: { from: reason, desc: 출장사유(과제 내용으로 쓴다) }
  예상경비: { from: cost, show: won, desc: 예상경비 — 300,000원 }
