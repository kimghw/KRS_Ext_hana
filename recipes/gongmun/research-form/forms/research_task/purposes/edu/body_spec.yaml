# 교육 품의의 제목·본문 틀 — 꼴(틀·vars·show)은 purchase/body_spec.yaml 머리말과 같다. 원본 연구공문처럼 '가. 과제 개요' 를 앞에 두고 '나.' 에 교육을 적는다.
title: '{과제별명} 수행을 위한 {교육구분} 품의'
body: |-
  1. {부서:은} {과제개요}.
  2. 이와 관련하여 {교육목적:을} 위하여 아래와 같이 {교육구분:에} 참가하고자 하오니 재가하여 주시기 바랍니다.

  ------------ 아   래 ------------

  {차례}. 과제 개요
      {세부차례} 과 제 명 : {과제명}
      {세부차례} 과제번호 : {과제번호?}
      {세부차례} 연구기간 : {연구기간?}
      {세부차례} 과제책임자 : {과제책임자?}
  {차례}. 교육 내용
      {세부차례} 교 육 명 : {교육명}
      {세부차례} 교육기관 : {교육기관}
      {세부차례} 교육기간 : {교육기간}
      {세부차례} 교육시간 : {교육시간?}
      {세부차례} 교육장소 : {교육장소}
      {세부차례} 교육내용 : {교육내용?}
      {세부차례} 참 석 자 : {참석자}
      {세부차례} 교 육 비 : {교육비} (VAT 포함)
      {세부차례} 예산계정 : {계정}
      {세부차례} 교육사유 : {교육사유}

  ※ 첨 부
  {첨부}
vars:
  교육구분: { from: mode, desc: 교육 또는 온라인교육 — 교육 구분 칸(교육장소가 온라인이면 저절로) }
  교육명: { from: course, desc: 교육명 }
  교육기관: { from: provider, desc: 교육기관 }
  교육기간: { from: [from, to], show: period, desc: '시작일 ~ 종료일(며칠) — 2026. 11. 3. ~ 2026. 11. 5. (3일), 하루면 2026. 11. 3. (1일)' }
  교육시간: { from: hours, desc: 교육시간 }
  교육장소: { from: place, desc: 교육장소 }
  교육내용: { from: topics, desc: 교육 내용(커리큘럼) }
  참석자: { from: attendees, or: me, desc: 참석자(비면 내 이름) }
  교육비: { from: fee, show: won, desc: 교육비 — 450,000원 }
  교육목적: { from: purpose, desc: 교육목적 }
  교육사유: { from: reason, desc: 교육사유(과제 내용으로 쓴다) }
