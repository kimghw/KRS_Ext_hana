# ktx-fares.yaml — KTX 운임을 **손으로 고치는 파일**. 여비계산서의 KTX 정가를 여기와 ktx-fares-official.yaml 에서 찾는다.
#
#   ktx-fares-official.yaml  코레일 공식 KTX 운임표에서 가져온 542개 구간(일반실·특실). 생성물이라 손대지 않는다.
#   ktx-fares.yaml (이 파일)  고치거나 더할 구간만 적는다 — **여기 적은 구간이 공식 표의 같은 구간을 이긴다.**
#                             그리고 역을 찾는 길잡이(places·airports), 갈아타는 역(transfers), 주말 요일.
#
# - 고친 뒤에는 `node tools/gen-travel.mjs`(npm run gen)로 src/travelspec.js 를 다시 만든다(확장은 YAML 을 읽지 못한다).
#   두 파일을 합친 결과 — 확장이 실제로 쓰는 값 — 는 같이 만들어지는 references/review.md 에서 표로 본다.
# - 운임은 **어른 편도 정가**(원)다. standard = 일반실, first = 특실(운임 + 특실 요금). 모르는 값은 적지 않는다(null) — 짐작으로 채우지 않는다.
# - 구간은 방향이 없다(a↔b). 역 이름은 KTX 역 이름 그대로 적는다.
#
# 알아 둘 것(공식 표에 대해 — 2026-09-01 KTX·SRT 통합 운임, 서울↔부산 59,800 → 54,400원)
# 1. **같은 두 역도 경유하는 길마다 운임이 다르다.** 서울↔부산만 해도 경주 경유 54,400, 서대구 경유 54,000, 구포 경유 48,900,
#    수원 경유 48,000 원이다. 공식 표에서는 **일반실 운임이 가장 큰 값**(고속선을 곧장 가는 길)을 그 구간의 정가로 가져왔다 —
#    사전정산에는 정가를 넣고, 다른 길로 가는 열차를 탔으면 사후정산 때 바로잡는다. 늘 다른 길로 다닌다면 여기 routes 에 그 값을 적는다.
# 2. **특실은 일반실의 1.45 배쯤이다**(100원 단위). 공식 표의 값을 그대로 쓴다.
# 3. **KTX-이음 노선(강릉·중앙·중부내륙·동해선)은 공식 표에서 가져오지 않았다** — 특실이 없고 운임이 두 벌이다. 그쪽 구간이 필요하면
#    여기 routes 에 적는다(first 는 null).
# 4. **요일(평일·주말) 차등은 없다.** 그래도 나중에 생기면 넣을 수 있게 구간마다 weekend 를 받는다 — weekend 가 없으면
#    평일·주말이 같은 값이다. 주말로 치는 요일은 weekend_days 다.
# 5. **구간마다 대략 소요 시간(hours, 시간 단위)이 운임과 함께 붙는다** — 여비계산서 교통편 줄의 출발·도착 시각이 된다.
#    맨 아래 times 에서 셈하고, 한 구간만 바꾸려면 times.routes 에 한 줄 적는다.

version: 1

# 주말 운임을 따로 적은 구간에서 주말로 치는 요일(코레일이 예전에 쓰던 구분: 금·토·일).
weekend_days: [금, 토, 일]

# 고치거나 더할 구간. 비어 있으면 공식 표 그대로다. 한 줄에 한 구간:
#   - { a: 서울, b: 부산, standard: 54400, first: 78900, note: "까닭" }          공식 표의 값을 바꾼다
#   - { a: 서울, b: 강릉, standard: 27600, first: null, hours: 2, note: "KTX-이음" }   공식 표에 없는 구간을 더한다
#   - { a: 서울, b: 부산, standard: 54400, first: 78900, weekend: { standard: 56000, first: 81200 } }   주말 운임이 따로 있을 때
# 공식 표에 없는 역이 든 구간은 소요 시간을 셈할 길(times.links)이 없다 — 그 줄에 hours 를 같이 적는다(안 적으면 생성기가 멈춘다).
# note 에는 왜 고쳤는지·어디서 본 값인지를 남긴다 — 검토표(review.md)의 "손으로 고친 구간"에 같이 적힌다.
# 운임은 100원 단위이고 특실은 일반실보다 커야 한다(생성기가 본다). 고친 뒤 찍히는 "바뀐 것" 줄로 뜻대로 들어갔는지 확인한다.
routes: []

# 출장지·근무지에 적은 글에서 탈 역을 찾는 길잡이. 글에 역 이름이 들어 있으면 그 역이고("부산 본사" → 부산),
# 역 이름이 없는 곳은 여기서 찾는다("경기도 고양시 킨텍스" → 서울). 역 이름과 같은 글이 여기에도 있으면 여기 것이 이긴다
# ("창원" 은 창원역이 아니라 창원중앙역으로 본다). 글에 여럿이 들어 있으면 **먼저 나오는 것**이다("서울 영등포구" → 서울).
# 여기에도 없으면 교통편은 비워 둔다.
#
# 값은 역 하나이거나 **후보 역의 목록**이다(2026-10-04 사용자 지정: 출장지에 KTX 역이 없으면 가까운 역 가운데 먼 역으로).
#   - 그 도시에 KTX 역이 있으면 그 역 하나를 적는다.
#   - 없으면 그 도시에서 KTX 를 타러 가는 가까운 역들을 적는다. 후보가 여럿이면 **근무지 쪽 역에서 운임이 가장 큰(가장 먼) 역**을 고른다 —
#     부산에서 용인이면 수원(44,300)이 아니라 동탄(48,300), 인천이면 광명(52,200)이 아니라 서울(54,400)이다.
#     근무지 쪽 역이 후보에 들어 있으면 그 역이다(같은 역이라 교통편을 비운다). 근무지를 모르거나 운임이 같으면 앞에 적은 역이다.
#
# 인구 50만 이상인 시는 모두 찾을 수 있게 해 두었다(2026-10-04 조사 — 거리는 시청에서 역까지의 직선 거리를 어림한 값이다).
#   역 이름이 곧 도시 이름    서울 · 부산 · 대전 · 울산 · 수원 · 전주 (· 포항)
#   도시 안에 역이 있다       대구 → 동대구 · 광주 → 광주송정 · 창원 → 창원중앙 · 청주 → 오송 · 천안 → 천안아산 · 평택 → 평택지제 ·
#                             화성 → 동탄 · 김해 → 진영
#   역이 없다                 인천 · 용인 · 성남 · 부천 · 남양주 · 안산 · 안양 · 시흥 · 파주 · 김포 — 아래에 까닭을 적었다
#   고양                      시 안에 행신역이 있다(부산↔행신 55,700 — 서울보다 1,300원 많다). 행신까지 가는 KTX 는 일부뿐이고 킨텍스·일산은
#                             서울역에서 GTX-A·경의중앙선이 바로 가서 **서울로 두었다** — 행신으로 하려면 고양·일산·킨텍스를 행신으로 고친다.
places:
  고양: 서울
  일산: 서울
  킨텍스: 서울
  세종: 오송
  청주: 오송
  대구: 동대구
  광주: 광주송정
  # "경기도 광주시"가 광주송정으로 가지 않게 막는다(먼저 나오는 글이 이긴다). 가까운 역은 수서(약 17km).
  경기도 광주: 수서
  경기 광주: 수서
  천안: 천안아산
  아산: 천안아산
  창원: 창원중앙
  여수: 여수엑스포
  구미: 김천구미
  김천: 김천구미
  평택: 평택지제
  # ---- 도시 안에 역이 있다
  화성: 동탄                 # 동탄역이 화성시에 있다
  김해: 진영                 # 진영역이 김해시에 있다(경전선 — 서울 쪽에서만 바로 간다). 구포(약 10km)는 넣지 않았다 — 부산에서 김해 가는 출장에 부산→구포가 들어간다
  # ---- KTX 역이 없다: 가까운 역(후보가 여럿이면 근무지에서 먼 역)
  인천: [서울, 광명]         # 광명 약 17km · 서울 약 26km(공항철도·1호선이 바로 간다). 인천발 KTX(송도역)는 2026-12 개통 예정 — 열리면 고친다
  용인: [동탄, 수원]         # 동탄 약 9km · 수원 약 16km
  성남: 수서                 # 수서 약 8km
  분당: 수서
  판교: 수서
  부천: [서울, 광명]         # 광명 약 14km · 서울 약 19km(1호선이 바로 간다)
  남양주: [서울, 수서]       # 수서 약 19km · 서울 약 23km(경의중앙선이 바로 간다). 청량리(KTX-이음)는 운임표에 없다
  안산: [광명, 수원]         # 광명 약 12km · 수원 약 16km
  안양: 광명                 # 광명 약 7km
  시흥: 광명                 # 광명 약 8km
  파주: 서울                 # 경의중앙선·GTX-A 가 서울역으로 바로 간다(행신 약 17km — 고양과 같은 까닭으로 서울)
  김포: 서울                 # 김포골드라인·공항철도로 서울역(행신 약 10km 는 한강 건너이고 편이 적다)

# 갈아타는 역(2026-10-04 사용자 지정: 목포처럼 바로 가는 KTX 가 없으면 갈아타는 두 구간으로 넣는다).
# 두 역을 바로 잇는 구간이 운임표에 없을 때 갈아타는 길을 찾는다 — 어느 역에서 갈아타든 두 구간의 일반실 운임을 더한 값이 가장 작은
# 역이 **여기 적은 역일 때만** 그 길을 쓴다. 부산→목포는 오송에서 갈아탄다(부산↔오송 37,800 + 오송↔목포 31,700 = 69,500 —
# 호남선 KTX 는 대전역에 서지 않는다. 서대전은 대전역과 다른 역이다).
# 노선이 갈라지는 역만 적는다: 오송(경부 ↔ 호남·전라), 익산(호남 ↔ 전라). 밀양·동대구는 적지 않았다 — 적으면 부산에서 창원·진주·포항 가는
# 출장에 밀양·동대구에서 갈아타는 KTX 가 자동으로 들어간다(그 길은 버스나 차로 다닌다). 그런 길이 필요하면 여기에 역을 더한다.
transfers: [오송, 익산]

# 항공권에 적힌 공항이 근무지 쪽인지 출장지 쪽인지 가릴 때 쓰는 길잡이 — 공항 이름·코드 → 그 도시의 KTX 역.
# (가는 편·오는 편을 가릴 때만 쓴다. 운임을 찾는 데에는 쓰지 않는다.)
airports:
  김해: 부산
  PUS: 부산
  김포: 서울
  GMP: 서울
  인천: 서울
  ICN: 서울

# ---------------------------------------------------------------- 구간의 대략 소요 시간
# 여비계산서 교통편 줄의 "시간" 칸(출발지·도착지 옆)에 쓴다(2026-10-03 사용자 지정) — 가는 편은 출장 출발 시각에 떠나
# 이 시간 뒤에 닿고, 오는 편은 출장 도착 시각에 닿게 이 시간만큼 앞서 떠난다. 07시 출발·20시 도착, 부산↔서울 4시간이면
#   가는 편  부산 07시 → 서울 11시        오는 편  서울 16시 → 부산 20시
#
# 시간은 **넉넉히 올려 잡은 시간 단위**다 — 서울↔부산처럼 KTX 가 2시간 30분 ~ 3시간 20분이면 4시간, 가장 짧아도 1시간.
# 셈: 이웃한 역 사이의 분(links)을 이어 두 역 사이의 분을 얻고(가장 빠른 길), margin_minutes 를 더해 시간 단위로 올린다.
#   서울↔부산  172분 + 10분 → 4시간      부산↔대전  107분 + 10분 → 2시간      부산↔울산  25분 + 10분 → 1시간
# 분은 정차역마다 서는 열차를 어림한 값이다(시간표를 옮긴 것이 아니다). 만든 값은 src/travelspec.js 의 구간마다 hours 로 운임 옆에 적힌다.
times:
  min_hours: 1
  margin_minutes: 10

  # 한 구간의 시간을 따로 정할 때 — 여기 적은 값이 셈한 값을 이긴다(방향은 가리지 않는다).
  #   - { a: 부산, b: 대전, hours: 3 }
  routes: []

  # 이웃한 역 사이의 대략 분(정차 포함). [역, 역, 분]
  links:
    # 경부고속선
    - [행신, 서울, 22]
    - [서울, 용산, 5]
    - [서울, 광명, 16]
    - [용산, 광명, 14]
    - [광명, 천안아산, 22]
    - [천안아산, 오송, 12]
    - [오송, 대전, 15]
    - [대전, 김천구미, 25]
    - [김천구미, 동대구, 25]
    - [김천구미, 서대구, 22]
    - [서대구, 동대구, 8]
    - [동대구, 경주, 20]
    - [경주, 울산, 12]
    - [울산, 부산, 25]
    # 경부선(구포 경유 · 수원 경유)
    - [동대구, 경산, 8]
    - [경산, 밀양, 25]
    - [밀양, 물금, 18]
    - [물금, 구포, 10]
    - [구포, 부산, 13]
    - [서울, 영등포, 9]
    - [영등포, 수원, 22]
    - [수원, 대전, 68]
    # 경전선 · 동해선
    - [밀양, 진영, 12]
    - [진영, 창원중앙, 10]
    - [창원중앙, 창원, 8]
    - [창원, 마산, 6]
    - [마산, 진주, 32]
    - [동대구, 포항, 35]
    # 호남고속선
    - [오송, 공주, 15]
    - [공주, 익산, 17]
    - [익산, 정읍, 15]
    - [정읍, 광주송정, 17]
    - [광주송정, 나주, 10]
    - [나주, 목포, 25]
    # 호남선(서대전 경유)
    - [오송, 서대전, 25]
    - [서대전, 계룡, 15]
    - [계룡, 논산, 15]
    - [논산, 익산, 20]
    - [익산, 김제, 12]
    - [김제, 정읍, 13]
    - [정읍, 장성, 15]
    - [장성, 광주송정, 13]
    # 전라선
    - [익산, 전주, 17]
    - [전주, 남원, 30]
    - [남원, 곡성, 11]
    - [곡성, 구례구, 11]
    - [구례구, 순천, 20]
    - [순천, 여천, 15]
    - [여천, 여수엑스포, 10]
    # 수서고속선
    - [수서, 동탄, 17]
    - [동탄, 평택지제, 10]
    - [평택지제, 천안아산, 12]
