# input.yaml — LLM 이 사용자의 말을 **구조화해 실행자에 넘길 때** 참조하는 명세. 단일 출처다.
#
#   사용자 말 → LLM(로컬 CLI·API 키) 또는 규칙 해석 → 여기 적힌 구조 → 검증 관문 → 실행자
#
# - LLM 에게 주는 지시문(system)과 JSON 스키마는 이 파일에서 만든다(src/input.js 의 systemPrompt·jsonSchema).
#   로컬 CLI 다리(native/host.mjs)와 API(src/ai.js)가 같은 것을 쓴다.
# - 어느 길로 왔든 실행자에 넘기기 전에 이 명세로 검증·정규화한다(src/input.js 의 structure).
#   명세에 없는 키는 버리고, 모양이 틀린 값은 넘기지 않는다.
# - 확장은 YAML 을 읽지 못한다. 이 파일을 고친 뒤에는 `node tools/gen-input.mjs` 로
#   src/inputspec.js 를 다시 만든다. 둘이 어긋나면 test/input.test.mjs 가 잡는다.
#
# 필드의 형(type)
#   date     YYYY-MM-DD, 달력에 있는 날
#   time     HH:MM 24시간제
#   integer  정수. min·max 로 범위를 준다
#   number   수. min·max 로 범위를 준다
#   string   글. max 는 글자 수 한도(넘치면 자른다). 빈 글은 null 로 본다
#   enum     values 중 하나
#   boolean  true / false
#
# required: true 인 필드는 반드시 올바른 값이 있어야 한다 — 없거나 틀리면 그 답을 통째로 버리고
# 다음 길로 내려간다(로컬 CLI → API 키 → 규칙 해석). 나머지 필드는 "말하지 않았으면 null" 이고,
# 틀린 값이 오면 그 칸만 null 로 비우고 무엇을 비웠는지 알린다(틀린 값으로 채우느니 비워 둔다).
#
# 값은 모양만 맞추지 않고 정규화한다 — "9:00" 은 "09:00" 으로, "10" 은 10 으로, 앞뒤 공백은 뗀다.
#
# checks 는 두 칸 사이의 관계다. 둘 다 값이 있을 때만 본다. drop 이 있으면 어긋날 때 그 칸만 비우고
# message 를 사용자에게 알리며, 없으면 답을 통째로 버린다(message 는 버린 까닭이다).

version: 1

tasks:

  # ------------------------------------------------------------ 회의실·차량 말로 찾기
  parse:
    title: 회의실·차량 조회 조건
    kinds: [room, car]
    # consumer 는 이 구조를 직접 받는 코드, next 는 그 뒤에 실행자까지 가는 길이다.
    # 조회 조건은 예약 명령이 아니다 — 빈 시간을 찾을 뿐이고, 예약은 사용자가 후보를 고른 뒤에 나간다.
    consumer: { module: src/search.js, export: findSlots }
    next: 사용자가 후보를 고른다 → src/runners.js 의 room·car 실행자가 예약한다(reserve)
    # 종류가 받지 않는 조건은 비우고 그 사실을 알린다. 종류는 화면이 정한다(LLM 이 정하지 않는다).
    variants:
      car:
        clear:
          minSeats: 차량은 좌석 수를 알 수 없어 인원 조건은 뺐습니다
          region: 차량은 지역을 가리지 않아 지역 조건은 뺐습니다
    role: >-
      당신은 사내 회의실·업무용 차량 예약 도우미입니다. 사용자의 한국어 요청을 조회 조건으로 바꿉니다.
      회의실을 찾는지 차량을 찾는지는 입력의 "찾는 대상" 줄이 알려 줍니다. 두 경우 모두 같은 키를 씁니다.
    fields:
      dateFrom: { type: date, required: true, desc: 조회 시작일 }
      dateTo: { type: date, required: true, desc: 조회 종료일(포함) }
      hourFrom: { type: integer, required: true, min: 0, max: 23, desc: 하루 중 조회 시작 시 }
      hourTo: { type: integer, required: true, min: 1, max: 24, desc: 하루 중 조회 종료 시 }
      minSeats: { type: integer, min: 1, max: 999, desc: 필요한 최소 좌석 수 }
      minHours: { type: number, min: 0.5, max: 24, desc: 연속으로 필요한 최소 시간 }
      region: { type: enum, values: [부산, 서울], desc: 지역 }
      summary: { type: string, required: true, max: 200, desc: 해석한 조건을 한 줄로 요약(한국어) }
    checks:
      - { left: dateFrom, op: "<=", right: dateTo, message: 종료일이 시작일보다 앞섭니다 }
      - { left: hourFrom, op: "<", right: hourTo, message: 종료 시가 시작 시보다 늦어야 합니다 }
    rules:
      - 날짜가 없으면 오늘 하루만 조회합니다(dateFrom = dateTo = 오늘).
      - '"내일", "이번 주", "다음 주" 같은 표현은 오늘을 기준으로 실제 날짜로 바꿉니다.'
      - 연도가 없으면 오늘과 같은 해로 봅니다.
      - 시간대가 없으면 hourFrom 9, hourTo 18 로 둡니다.
      - '"10명" 처럼 인원이 나오면 minSeats 에 넣습니다. 차량에는 좌석 정보가 없으므로 찾는 대상이 차량이면 minSeats 는 항상 null 입니다.'
      - '"2시간짜리" 처럼 필요한 길이가 나오면 minHours 에 넣습니다.'
      - 지역은 부산 또는 서울만 가능합니다.
      - summary 는 사용자가 확인할 수 있게 해석 결과를 한 줄로 적습니다.

  # ------------------------------------------------------------ 근태 폼 말로 채우기
  attend:
    title: 근태 신청 폼 조각
    kinds: [attend]
    # 조각은 **부분 수정**이다. null 은 "바꾸지 않음"이지 "지우기"가 아니다 — 관문이 null 인 칸을 빼고 넘긴다.
    # 조각을 폼에 얹을 뿐이고(applyPatch), HR 에 올라가는 것은 사용자가 폼을 확인해 누른 뒤다.
    partial: true
    consumer: { module: src/attend.js, export: applyPatch }
    next: 사용자가 폼을 확인하고 누른다 → src/attend.js buildJob → src/hr.js hrRunJob
    role: >-
      당신은 사내 근태 신청 도우미입니다. 사용자의 말에서 근태 신청 폼에 넣을 값을 뽑습니다.
      입력에는 오늘 날짜와 달력, 지금 폼(JSON), 앞선 대화, 새 요청이 들어 있습니다.
    fields:
      kind:
        type: enum
        values: [flex, out, leaveout, trip, leave, health]
        desc: 근태 종류. flex(유연근무)·out(외근·교육·부서소통회)·leaveout(외출)·trip(출장)·leave(휴가)·health(건강검진)
      sub:
        type: enum
        values: [OD, TR, MEET, LY, LH]
        desc: 종류 안의 갈래. out 이면 OD(외근)·TR(교육)·MEET(부서소통회), leave 이면 LY(연차·반차)·LH(체력단련)
      half: { type: enum, values: [am, pm, full], desc: 하루짜리 연차의 구분. am(오전 반차)·pm(오후 반차)·full(전일). 휴가가 아니면 null }
      dateFrom: { type: date, desc: 날짜(출장·휴가는 시작일) }
      dateTo: { type: date, desc: 여러 날 출장·휴가의 종료일. 그 외에는 null }
      days: { type: integer, min: 1, max: 31, desc: '출장·휴가가 며칠간인지(당일 1, 1박 2일이면 2). 출장·휴가가 아니면 null' }
      start: { type: time, desc: 시작 시각 }
      end: { type: time, desc: 종료 시각 }
      place: { type: string, max: 200, desc: 장소 }
      purpose: { type: string, max: 200, desc: 목적·사유 }
      flexStart:
        type: enum
        values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']
        desc: 유연근무의 새 출근시간(당일·전체일 때)
      flexMode: { type: enum, values: [day, week, all], desc: 유연근무를 넣는 길. day(당일)·week(주간·요일별)·all(전체·매일·월~금 모두) }
      flexMon:
        type: enum
        values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']
        desc: 주간 유연근무의 월요일 출근시간
      flexTue:
        type: enum
        values: ['08:00', '08:30', '09:00', '09:30', '10:00']
        desc: 주간 유연근무의 화요일 출근시간
      flexWed:
        type: enum
        values: ['08:00', '08:30', '09:00', '09:30', '10:00']
        desc: 주간 유연근무의 수요일 출근시간
      flexThu:
        type: enum
        values: ['08:00', '08:30', '09:00', '09:30', '10:00']
        desc: 주간 유연근무의 목요일 출근시간
      flexFri:
        type: enum
        values: ['07:00', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00']
        desc: 주간 유연근무의 금요일 출근시간
      allDay: { type: boolean, desc: 건강검진을 하루 전체로 올리는가. 건강검진이 아니면 null }
      reply: { type: string, max: 300, desc: 무엇을 채웠는지 한국어 한 문장 }
    checks:
      - { left: dateFrom, op: "<=", right: dateTo, drop: dateTo, message: 종료일이 시작일보다 앞서 종료일은 뺐습니다 }
    rules:
      - '**이번 말에서 사용자가 말한 것만** 채웁니다. 말하지 않은 칸은 null 입니다. 장소와 목적을 지어내지 않습니다.'
      - 지금 폼에 이미 들어 있는 값을 되풀이하지 않습니다. 바꾸라고 한 것만 넣습니다.
      - '"내일", "다음 주 수요일" 같은 표현은 오늘을 기준으로 실제 날짜로 바꿉니다. 연도가 없으면 오늘과 같은 해입니다.'
      - 요일은 셈하지 말고 입력의 달력 줄에서 찾습니다.
      - 'flex 는 유연근무(출근시간 변경. 자율출퇴근·시차출근이라고도 말합니다)입니다. 넣는 길(flexMode)은 셋입니다 — day(당일: 그 날 하루), week(주간: 월~금 요일마다), all(전체: 월~금 모두 같은 시간).'
      - 'flexMode 가 week 이면 말한 요일의 출근시간만 flexMon~flexFri 에 넣고 flexStart 는 null 입니다. day·all 이면 flexStart 를 쓰고 flexMon~flexFri 는 null 입니다.'
      - '07:00·11:00 출근은 월요일·금요일에만 있습니다.'
      - '교육은 kind 가 out 이고 sub 가 TR 입니다. 외근이라고 말했으면 sub 는 OD 입니다.'
      - '부서소통회(소통회)는 kind 가 out 이고 sub 가 MEET 입니다. 시각(13:00~14:00)과 목적("부서소통회")은 폼이 채우므로, 사용자가 다르게 말했을 때만 start·end·purpose 를 넣습니다.'
      - '휴가(leave)의 sub 는 LY(연차·반차) 또는 LH(체력단련·체력관리)이고, 그냥 "휴가"라고만 했으면 sub 는 null 입니다.'
      - '"오전 반차"·"오후 반차"는 half 에 am·pm 을, 하루 종일이라고 했으면 full 을 넣습니다. 휴가에는 장소·목적이 없습니다.'
      - '시각은 24시간제 HH:MM 입니다. 외근·외출·건강검진은 30분 단위, 출장·교육은 정시 단위입니다.'
      - '"2시부터 3시간" 처럼 길이로 말했으면 end 에 끝나는 시각을 셈해 넣습니다.'
      - 'dateTo 는 여러 날 출장·휴가일 때만 넣습니다. "1박 2일"·"3일간" 처럼 기간으로 말했으면 days 에 날 수를 넣습니다(당일은 1).'
      - allDay 는 건강검진일 때만 true/false 이고, 그 외에는 null 입니다.
      - 'reply 에는 **무엇을 채웠는지만** 한 문장으로 적습니다("…채웠습니다"). 아직 아무것도 올라가지 않았으므로 등록·신청했다고 말하지 않고, 비어 있는 칸은 적지 않습니다(화면이 따로 보여 줍니다).'

  # ------------------------------------------------------------ 출장 증빙 읽기(신청 내역의 출장 카드)
  receipt:
    title: 출장 증빙(숙박 영수증·예약서·항공권·출장지에서 결제한 영수증) 읽기
    kinds: [trip]
    # 파일 하나 → 기록 하나. 여러 장을 넣으면 한 장씩 읽어 src/after.js 가 숙박비·교통비 내역으로 묶는다.
    # 사용자가 증빙을 넣는 순간 자동으로 사후정산을 짓고 올린다(2026-10-03 사용자 지정) — 읽지 못한 필수 값이 있으면 올리지 않고 알린다.
    # 항공권은 가는 편·오는 편의 교통편도 정한다(src/travel.js 의 ticketsOf·seatTickets) — 그 날짜(당일이면 시각)의 편이 비행기가 되고,
    # 항공권이 편도뿐이면 나머지 편은 KTX 다. 기차표는 증빙으로 받지 않는다(KTX 는 운임표의 정가). 당일 출장의 증빙은
    # 그 출장지에서 결제한 영수증이다 — 출장지에서 결제했는지를 읽을 때 같이 가린다(atDestination).
    # 이 작업만 첨부 파일(이미지·PDF)을 글 앞에 붙여 보낸다(API 는 image/document 블록, 로컬 CLI 는 같은 블록을 메시지에 싣거나 임시 파일 + Read 도구).
    # 로컬 CLI 다리는 그 전에 글자를 먼저 뽑는다(2026-10-04 사용자 지정, native/doctext.mjs) — 글자 층이 있는 PDF 는 뽑은 글자만 입력에 적어
    # 보내고(첨부 없음), 그림과 스캔한 PDF 는 OCR 한 글자를 입력에 적고 파일도 붙인다. API 길은 전처럼 파일째 보낸다.
    # 같은 기록을 **사후정산 입력 화면**(eclass /BusinessTrip/AfterTrip)의 콘텐츠 스크립트도 쓴다(src/afterpage.js 의 fillPlan) —
    # 그 화면에 놓은 증빙은 올리지 않고 줄을 더해 칸만 채운다. 거기서는 사용자가 직접 놓은 것이므로 기차표·버스표·택시 영수증도
    # 교통비 줄이 된다(그래서 그 표들의 일자·구간·금액과 transport 도 읽는다 — 출장 카드는 여전히 쓰지 않는다).
    consumer: { module: src/after.js, export: afterPlan }
    next: src/after.js afterPlan 이 숙박비·교통비·항공 마일리지로 묶는다 → src/trip.js tripAfterSave 가 eclass 여비계산서 사후정산(AfterTrip/Save)에 올린다
    role: >-
      당신은 사내 출장 여비 정산 도우미입니다. 첨부한 문서 한 장(숙박 영수증·인보이스·숙박 예약 확인서·항공권·기차표·카드 영수증·전자영수증 등의 이미지나 PDF)을 읽어
      여비계산서 정산에 넣을 값을 뽑습니다. 입력에는 출장 정보(기간·출장지·출장자)와 파일 이름이 들어 있습니다.
    fields:
      docType:
        type: enum
        required: true
        values: [lodging_receipt, lodging_booking, flight_ticket, flight_receipt, train_ticket, bus_ticket, other_receipt, unknown]
        desc: 문서 종류. lodging_receipt(숙박 결제 영수증·인보이스)·lodging_booking(숙박 예약 확인서)·flight_ticket(항공권·탑승권·e-티켓)·flight_receipt(항공권 결제 영수증)·train_ticket(기차표)·bus_ticket(버스표)·other_receipt(그 밖의 영수증)·unknown(모름)
      vendor: { type: string, max: 100, desc: 업체명(실제로 묵은 숙박업소·가맹점 이름 또는 항공사) }
      # 여비계산서의 업체명 칸에는 묵은 곳이 아니라 **산 곳**을 적는다(2026-10-03 사용자 지정 — 아고다에서 샀으면 아고다).
      seller: { type: string, max: 100, desc: '구매처 — 돈을 받은 곳. 예약 대행사를 거쳐 샀으면 그 대행사(아고다·부킹닷컴·야놀자 등), 직접 결제했으면 그 업체' }
      sellerBiz: { type: string, max: 100, desc: '구매처의 사업자명(문서에 적힌 상호·법인명 — "Agoda Company Pte. Ltd.", "(주)야놀자"). 적혀 있지 않으면 null' }
      bizNo: { type: string, max: 20, desc: 구매처의 사업자등록번호(000-00-00000). 적혀 있지 않으면 null }
      payDate: { type: date, desc: 결제일(영수증의 승인·결제 날짜) }
      payPlace: { type: string, max: 100, desc: 결제한 곳 — 영수증에 적힌 가맹점 주소나 지역(시·군·구까지). 적혀 있지 않으면 null }
      atDestination: { type: boolean, desc: '그 밖의 영수증(other_receipt)이 입력의 출장지와 같은 지역(시·군·구)에서 결제된 것인가. 영수증의 주소·지점명으로 가리고, 알 수 없으면 null' }
      checkIn: { type: date, desc: 숙박 체크인 날짜 }
      checkOut: { type: date, desc: 숙박 체크아웃 날짜 }
      nights: { type: integer, min: 1, max: 60, desc: 숙박 일수(박) }
      total: { type: number, min: 0, desc: 총 결제 금액(숫자만) — 문서에 적힌 화폐(currency)의 금액 }
      # 정산금액은 원화로만 적는다(2026-10-03 사용자 지정). 외화 문서에 원화 금액이 같이 있으면 그것을 쓰고, 없으면 사람에게 묻는다.
      totalKRW: { type: number, min: 0, desc: 외화 문서에 원화로 결제·청구된 금액이 같이 적혀 있을 때 그 원화 금액. 원화 문서이거나 적혀 있지 않으면 null }
      supply: { type: number, min: 0, desc: 공급가액(부가세를 뺀 금액) — 문서에 따로 적혀 있을 때만 }
      vat: { type: number, min: 0, desc: 부가세 — 문서에 따로 적혀 있을 때만 }
      currency:
        type: enum
        # 사후정산 입력 화면의 화폐 목록 그대로다(2026-10-03 화면의 currencyOptions).
        values: [KRW, USD, EUR, JPY, CNY, TWD, AED, SGD, MYR, CAD, AUD, NZD, VND, JOD, KWD, BHD, ZAR, RUB, INR, PKR, IDR, TRY, SAR, QAR, BRL, THB, BND, ILS, PLN, SEK, CZK, DKK, NOK, BDT, KZT, MNT, GBP, EGP, PHP, MXN, HUF, CHF, HKD]
        desc: 화폐(ISO 세 글자 코드)
      corporateCard: { type: boolean, desc: 법인카드로 결제했다고 문서에 적혀 있는가 }
      transport:
        type: enum
        values: [plane, train, subway, ship, bus, taxi]
        desc: 교통비 문서(표·교통비 영수증)의 교통수단. plane(비행기)·train(기차)·subway(지하철)·ship(선박)·bus(버스)·taxi(택시). 교통비 문서가 아니면 null
      airline: { type: string, max: 50, desc: 항공사 이름(한국어로 — 대한항공·아시아나항공·에어프레미아·제주항공 등) }
      flightNo: { type: string, max: 20, desc: 편명(KE1234) }
      flightDate: { type: date, desc: 탑승일(비행기·기차·버스·택시 등을 탄 날) }
      depPlace: { type: string, max: 50, desc: 출발지(도시·공항·역) }
      arrPlace: { type: string, max: 50, desc: 도착지(도시·공항·역) }
      depTime: { type: time, desc: 출발 시각 }
      arrTime: { type: time, desc: 도착 시각 }
      seatClass: { type: string, max: 20, desc: 좌석 등급(일반석·비즈니스 등) }
      retDate: { type: date, desc: 왕복표의 돌아오는 편 탑승일. 편도면 null }
      retDepPlace: { type: string, max: 50, desc: 왕복표의 돌아오는 편 출발지. 편도면 null }
      retArrPlace: { type: string, max: 50, desc: 왕복표의 돌아오는 편 도착지. 편도면 null }
      retDepTime: { type: time, desc: 왕복표의 돌아오는 편 출발 시각. 편도면 null }
      retFlightNo: { type: string, max: 20, desc: 왕복표의 돌아오는 편 편명. 편도면 null }
      mileage: { type: integer, min: 0, max: 100000, desc: 이 항공권으로 적립되는 마일리지(문서에 적혀 있을 때만) }
      passenger: { type: string, max: 50, desc: 탑승자·투숙자 이름 }
      extra: { type: string, max: 300, desc: 계산서에 넣지 않지만 알아 둘 추가 정보(조식 포함·예약번호·취소 규정·수하물 등). 없으면 null }
      summary: { type: string, required: true, max: 200, desc: 문서를 한 줄로 요약(한국어) }
    checks:
      - { left: checkIn, op: "<=", right: checkOut, drop: checkOut, message: 체크아웃이 체크인보다 앞서 체크아웃은 뺐습니다 }
    rules:
      - 문서에 적힌 것만 채웁니다. 적혀 있지 않은 값은 null 이고, 추측하거나 지어내지 않습니다.
      # 2026-10-03 실제로 있던 일: 출장 카드를 찍은 화면(읽은 증빙의 요약이 적혀 있다)이 패널에 붙여 넣어져 숙박 예약서로 읽히고 숙박 줄이 하나 더 올라갔다.
      - '증빙은 **원본 문서**(영수증·인보이스·예약 확인서·표, 또는 그것을 보여 주는 예약 사이트·앱의 화면)입니다. 정산 프로그램의 화면을 찍은 것 — 여비계산서·사후정산 입력 화면, "증빙 넣는 곳"·"사후정산"·"올렸습니다"·"보관했습니다" 같은 글이 보이는 출장 카드 화면, 읽은 증빙의 요약이나 목록만 적힌 화면 — 은 증빙이 아닙니다. 그런 화면이면 docType 은 unknown 이고 나머지 값은 null 이며, summary 에 무슨 화면인지 적습니다.'
      - 금액은 쉼표·통화 기호 없이 숫자만 적습니다. 날짜는 YYYY-MM-DD, 시각은 24시간제 HH:MM 입니다.
      - 숙박 예약 확인서(결제 영수증이 아닌 것)는 lodging_booking 이고, 예약 금액이 있으면 total 에 적습니다.
      - 'seller 는 **돈을 받은 곳(구매처)**입니다. 예약 대행사(아고다·부킹닷컴·호텔스닷컴·익스피디아·트립닷컴·야놀자·여기어때 등)를 거쳐 결제한 문서면 그 대행사를 한국에서 부르는 이름으로 적고(Agoda → 아고다, Booking.com → 부킹닷컴), 숙박업소나 가맹점에 직접 결제한 문서면 그 업체 이름을 적습니다. vendor 에는 언제나 실제로 묵은 숙박업소(또는 가맹점·항공사) 이름을 적습니다.'
      - 'sellerBiz 는 문서에 적힌 구매처의 사업자명(상호·법인명)이고 bizNo 는 그 구매처의 사업자등록번호입니다. 문서에 적혀 있을 때만 적습니다.'
      - 'total 은 문서에 적힌 화폐의 금액이고 currency 는 그 화폐입니다. 외화 문서에 원화로 결제·청구된 금액이 같이 적혀 있으면 totalKRW 에 적습니다 — 환율로 셈하지 않습니다. 원화 문서면 totalKRW 는 null 입니다.'
      - 'supply(공급가액)·vat(부가세)는 문서에 따로 적혀 있을 때만 적습니다. 총액에서 셈해 넣지 않습니다.'
      - 체크인·체크아웃이 모두 있으면 nights 는 그 차이(박 수)입니다.
      - 항공권이면 airline 은 한국어 이름으로 적습니다(Korean Air → 대한항공, Asiana → 아시아나항공).
      - '왕복표(한 장에 가는 편과 오는 편이 같이 있는 것)면 가는 편을 flightDate·depPlace·arrPlace·depTime·flightNo 에, 오는 편을 retDate·retDepPlace·retArrPlace·retDepTime·retFlightNo 에 적습니다. total 은 문서의 총 결제 금액 그대로입니다.'
      - 편도표면 ret 으로 시작하는 칸은 모두 null 입니다. 여정이 셋 이상이면 처음 두 여정을 적고 나머지는 extra 에 적습니다.
      - '기차표(train_ticket)·버스표(bus_ticket)도 항공권처럼 탑승일(flightDate)·출발지(depPlace)·도착지(arrPlace)·출발 시각·도착 시각·좌석 등급(seatClass)·total 을 적습니다. airline·flightNo 는 null 입니다.'
      - 'transport 는 교통비 문서일 때만 적습니다 — 항공권은 plane, 기차표는 train, 버스표는 bus 입니다. 택시·지하철·선박처럼 표 종류가 따로 없는 교통비 영수증은 docType 을 other_receipt 로 두고 transport 에 수단을 적으며, 탄 날을 flightDate 에, 출발지·도착지가 적혀 있으면 depPlace·arrPlace 에 적습니다. 식당·카페·숙박처럼 교통비가 아니면 transport 는 null 입니다.'
      - '그 밖의 영수증(other_receipt — 식당·카페·편의점·택시 등의 카드 영수증)은 vendor·payDate·total 과 함께 payPlace(가맹점 주소·지역)를 적고, 그곳이 입력의 출장지와 같은 지역이면 atDestination 을 true, 다른 지역이면 false 로 적습니다. 주소·지점명이 없어 알 수 없으면 null 입니다 — 추측하지 않습니다.'
      - atDestination 은 other_receipt 일 때만 true/false 이고, 그 밖의 문서에서는 null 입니다.
      - corporateCard 는 문서에 법인카드라고 적혀 있을 때만 true 이고, 알 수 없으면 null 입니다.
      - 'summary 는 무엇의 어떤 문서인지 한 줄로 적습니다("○○호텔 1박 결제 영수증 143,000원").'

  # ------------------------------------------------------------ 예약 실패 원인 설명
  diagnose:
    title: 예약 실패 원인 설명
    kinds: [room, car]
    # 실행자에 넘기지 않는다. 성공 여부는 재조회가 이미 판정했고, 이 답은 화면과 활동 기록에 보여 주기만 한다.
    consumer: { module: src/llm.js, export: diagnoseSmart }
    next: 없음 — 화면·활동 기록에 표시만 한다
    role: >-
      당신은 ASP.NET WebForms 사내 시스템에 회의실·차량 예약을 자동 제출하는 프로그램의 진단 도우미입니다.
      예약을 제출했지만 다시 조회했을 때 그 예약이 보이지 않았습니다.
      입력은 저장 요청에 보낸 값과, 응답 페이지에서 **제출 전과 달라진 부분만** 추린 요약(JSON)입니다.
      회의실인지 차량인지는 요약의 "대상" 이 알려 줍니다.
    fields:
      verdict:
        type: enum
        required: true
        values: [rejected, maybe_saved, unknown]
        desc: 사이트가 거부한 것인지(rejected), 저장은 된 것 같은데 화면에 안 보이는 것인지(maybe_saved), 알 수 없는지(unknown)
      siteMessage: { type: string, max: 300, desc: 사이트가 사용자에게 실제로 띄운 문구 }
      cause: { type: string, required: true, max: 400, desc: 원인을 한국어 한두 문장으로 }
      fix: { type: string, max: 200, desc: 사용자가 할 수 있는 조치를 한국어 한 문장으로 }
    rules:
      - 응답에 새로 나타난 alert/스크립트나 안내 문구가 거부 사유를 말하고 있으면 verdict 는 rejected 입니다.
      - 거부 흔적이 전혀 없고 폼 값도 정상이면 verdict 는 maybe_saved 입니다(승인 대기 등으로 목록에 안 보일 수 있음).
      - 근거가 부족하면 verdict 는 unknown 입니다.
      - 예약이 됐는지 안 됐는지는 이미 재조회로 확인했습니다. 원인만 설명합니다.
      - 추측을 사실처럼 쓰지 않습니다. 근거가 없으면 없다고 합니다.
      - 한국어로, 짧고 구체적으로 씁니다.
