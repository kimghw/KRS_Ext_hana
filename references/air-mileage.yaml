# air-mileage.yaml — 항공 마일리지 표. 여비계산서 사후정산 "항공 마일리지"의 **신규 마일리지**를 여기서 찾는다(2026-10-04 사용자 지정).
#
# - 고친 뒤에는 `node tools/gen-travel.mjs` 로 src/travelspec.js 를 다시 만든다(확장은 YAML 을 읽지 못한다).
# - 항공권 문서에 적립 마일리지가 적혀 있으면 **그 값이 먼저다.** 적혀 있지 않을 때만 이 표에서 찾는다:
#     신규 마일리지 = 구간 마일(일반석 편도, 적립률 100%) × 좌석 등급의 적립률(%) — 편마다 셈해 더한다(마일 미만은 반올림).
#     대한항공 김포↔김해 왕복: 일반석 215 + 215 = 430마일 · 특실(프레스티지) 269 + 269 = 538마일
# - 좌석 등급은 둘이다. standard = 일반석, first = 특실·비즈니스(대한항공의 프레스티지석).
#   출장 카드의 가는 편·오는 편에서 비행기를 한 번 더 눌러 특실(+)로 골랐거나, 항공권의 좌석 등급에 first_seats 의 말이 적혀 있으면 first 다.
# - **여기 없는 항공사·구간은 채우지 않는다**(짐작하지 않는다) — 사후정산 화면에서 직접 적는다.
#
# 값의 출처(2026-10-04): 대한항공 스카이패스 "대한항공 탑승 마일리지 적립" 안내의 국내선 구간 마일리지와 예약 등급별 적립률.
#   https://www.koreanair.com/kr/ko/skypass/earn-miles/koreanair/overview
# 대한항공 홈페이지가 자동 접근을 막아 **그 페이지를 직접 읽어 확인하지는 못했다.** 검색에 잡힌 그 페이지의 내용과, 그 표를 옮겨 적은
# 다른 글의 값이 같아 그대로 적었다. 실제 적립과 다르면 여기서 고친다(여비계산서 화면의 "항공사 마일리지 안내 페이지" 링크에서 확인).
#
# 알아 둘 것
# 1. 적립률은 정확히는 **예약 등급(항공권의 영문 한 글자)**마다 다르다 — 국내선 프레스티지석 C·D 는 125%, Z 는 100%, 일반석 Y·B·M·S·H·E 는 100% 이고,
#    할인·단체 등급은 더 낮을 수 있다. 여기서는 좌석 등급만 본다(일반석 100 · 프레스티지 125). 다르게 적립됐으면 사후정산 화면에서 고친다.
# 2. 마일리지로 산 보너스 항공권은 적립되지 않는다 — 그때는 사후정산 화면에서 신규 마일리지를 지운다.
# 3. 구간은 방향이 없다(a↔b). 공항 이름은 아래 airports 의 이름으로 적는다.

version: 1
basis: "2026-10-04"
# 값을 맞춰 볼 원본(위 "값의 출처"의 그 페이지)과, 사람이 그 페이지를 직접 열어 이 표와 맞춰 본 날(YYYY-MM-DD).
# 아직 맞춰 보지 못했으면 null 이다 — 검토표(review.md)에 "아직 원본과 맞춰 보지 못함"으로 적힌다. 맞춰 보는 길은 `/refdata mileage`.
source: "https://www.koreanair.com/kr/ko/skypass/earn-miles/koreanair/overview"
checked: null

# 항공권의 좌석 등급 글에 이 말이 들어 있으면 first(특실·비즈니스)로 본다(영문은 대소문자를 가리지 않는다).
first_seats: [프레스티지, 비즈니스, 일등, 퍼스트, 특실, prestige, business, first]

airlines:
  - name: 대한항공
    # 항공권에 이렇게 적혀 있어도 같은 항공사다(영문은 대소문자를 가리지 않는다).
    aliases: [Korean Air, KAL]
    # 좌석 등급별 적립률(%)
    rates: { standard: 100, first: 125 }
    # 국내선 구간 마일(일반석 편도, 적립률 100%)
    routes:
      - { a: 김포, b: 김해, miles: 215 }
      - { a: 인천, b: 김해, miles: 215 }
      - { a: 김포, b: 제주, miles: 276 }
      - { a: 인천, b: 제주, miles: 276 }
      - { a: 김포, b: 여수, miles: 194 }
      - { a: 김포, b: 울산, miles: 203 }
      - { a: 김포, b: 사천, miles: 188 }
      - { a: 김포, b: 포항, miles: 188 }
      - { a: 인천, b: 대구, miles: 159 }
      - { a: 제주, b: 김해, miles: 186 }
      - { a: 제주, b: 청주, miles: 227 }
      - { a: 제주, b: 대구, miles: 203 }
      - { a: 제주, b: 군산, miles: 164 }
      - { a: 제주, b: 광주, miles: 111 }
      - { a: 제주, b: 사천, miles: 139 }
      - { a: 제주, b: 울산, miles: 214 }
      - { a: 제주, b: 원주, miles: 282 }
      - { a: 제주, b: 여수, miles: 109 }
      - { a: 제주, b: 포항, miles: 235 }

# 공항. 항공권에 적힌 출발지·도착지 글에서 공항을 찾는다 — **공항 이름과 코드(code)가 먼저**이고, 그것이 없을 때만 도시 이름(also)을 본다.
#   "부산(김해)" → 김해 · "PUS" → 김해 · "부산" → 김해 · "서울/김포" → 김포 · "서울(인천)" → 인천 · "서울" → 김포
# (ktx-fares.yaml 의 airports 는 다른 것이다 — 공항이 어느 도시 쪽인지 가려 가는 편·오는 편을 정하는 길잡이다.)
airports:
  김포: { code: GMP, also: [서울, Gimpo, Seoul] }
  인천: { code: ICN, also: [Incheon] }
  김해: { code: PUS, also: [부산, Gimhae, Busan] }
  제주: { code: CJU, also: [Jeju] }
  여수: { code: RSU, also: [순천, Yeosu] }
  울산: { code: USN, also: [Ulsan] }
  사천: { code: HIN, also: [진주, Sacheon, Jinju] }
  포항: { code: KPO, also: [경주, Pohang] }
  대구: { code: TAE, also: [Daegu] }
  청주: { code: CJJ, also: [Cheongju] }
  군산: { code: KUV, also: [Gunsan] }
  광주: { code: KWJ, also: [Gwangju] }
  원주: { code: WJU, also: [횡성, Wonju] }
