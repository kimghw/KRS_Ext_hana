# travel-rules.yaml — 여비계산서(사전정산)를 자동으로 지을 때 따르는 규칙. 단일 출처다.
#
#   출장 신청 폼(출발일·며칠간·출발·도착·출장지·근무지·교통편) → 여기 적힌 규칙 → 여비계산서 초안
#
# - 확장은 YAML 을 읽지 못한다. 이 파일이나 ktx-fares.yaml 을 고친 뒤에는 `node tools/gen-travel.mjs` 로
#   src/travelspec.js 를 다시 만든다. 둘이 어긋나면 test/travel.test.mjs 가 잡는다.
# - 규칙을 읽어 셈하는 코드는 src/travel.js 다. 여기 숫자를 바꾸면 셈이 따라 바뀐다.
# - 자동으로 짓는 것은 **사전정산 초안**이다. 1.5일만 청구하는 것 같은 예외는 만든 뒤 사이트에서 직접 고친다.
# - 사이트 화면(eclass /BusinessTrip/Write)은 2026-10-02 에 실제 화면 소스로 확인했다. code 는 그 화면의 선택지 값이다.

version: 1

# ---------------------------------------------------------------- 출장기간 구분
# 당일(하루)이면 "당일출장(주재국)", 1박 이상이면 "일반출장" 이다(2026-10-02 사용자 지정).
period:
  day_trip:
    code: "1"
    label: 당일출장(주재국)
    when: 출발일과 도착일이 같은 날(며칠간 = 1)
    # 당일출장(주재국)은 사이트가 종료일과 일비·식비 내역을 감추고, 대신 지역을 묻는다.
    # I = 사무실소재지, O = 사무실소재지외. 다른 도시로 가는 출장이 보통이라 O 를 깐다(2026-07-20 실제 문서도 O).
    area: O
  general:
    code: "0"
    label: 일반출장
    when: 1박 이상(며칠간 >= 2)

# 주재국. 국내 출장만 자동으로 짓는다.
nation:
  code: "KR||"
  label: 대한민국

# ---------------------------------------------------------------- 일비
# 일수 그대로다 — 이틀이면 일수 2, 일비 2. 줄여 청구할 때(2일인데 1.5일)는 만든 뒤 직접 고친다.
daily:
  per_day: 1

# ---------------------------------------------------------------- 식비(식수)
# 점심은 날마다 무조건 한 끼다. 아침은 첫날 일찍 떠났을 때, 저녁은 마지막 날 늦게 닿았을 때만 더한다.
# 그 사이의 끼니(첫날 저녁, 가운데 날의 세 끼, 마지막 날 아침)는 밖에 있으므로 모두 센다.
#
#   식수 = 3 × 일수 − (첫날 아침을 못 받으면 1) − (마지막 날 저녁을 못 받으면 1)
#
#   2일, 07:00 출발 · 20:00 도착 → 6   (아침·점심·저녁 / 아침·점심·저녁)
#   2일, 07:00 출발 · 16:00 도착 → 5   (마지막 날 저녁이 빠진다)
#   2일, 09:00 출발 · 16:00 도착 → 4
#   3일, 07:00 출발 · 20:00 도착 → 9
meals:
  per_day: 3
  lunch: always
  breakfast:
    # 첫날 출발 시각이 이 시(時) 이하이면 아침 한 끼를 더한다("7시 이전 출발" — 07:00 출발도 포함).
    first_day_depart_hour_at_most: 7
  dinner:
    # 마지막 날 도착 시각이 이 시(時) 이상이면 저녁 한 끼를 더한다("8시 이후 도착" — 20:00 도착도 포함).
    last_day_arrive_hour_at_least: 20

# ---------------------------------------------------------------- 교통편
# 운송수단은 대중교통(E)으로 올린다. 교통편은 **여럿을 함께 고를 수 있다**(기차 + 비행기 — 2026-10-03 사용자 지정).
# 교통편 내역(일자·출발지·도착지·요금)은 **기차(KTX)만 골랐을 때** 신청과 함께 자동으로 넣는다. 비행기·버스가 섞이면
# 어느 편이 무엇인지, 요금이 얼마인지 신청할 때는 알 수 없어 비워 둔다.
# 여기서 고르는 것은 **사전정산용**이다. 실제로 탄 것은 다녀온 뒤 신청 내역의 출장 카드에서 가는 편·오는 편마다 고르거나
# 표(항공권·기차표)를 넣어 **사후정산**에 올린다 — 처음에는 사전정산대로 골라져 있고, 항공권이 한 편뿐이면 나머지 편은 KTX 다.
transport:
  method: { code: E, label: 대중교통 }
  choices:
    - { value: train, label: 기차(KTX), site: Train, auto: true }
    - { value: plane, label: 비행기, site: Airplane, auto: false }
    - { value: bus, label: 버스, site: Bus, auto: false }
  default: train
  # KTX 구간에 넣는 줄 — 가는 길은 출발일, 오는 길은 도착일이다. 요금은 ktx-fares.yaml 에서 찾는다.
  train:
    grade: standard          # 기본 좌석 등급. 기차 아이콘을 한 번 더 누르면 first(특실)로 바뀐다
    # ktx-fares.yaml 의 좌석 등급(standard = 일반실, first = 특실)마다 여비계산서 "등급" 칸에 적는 글
    grade_labels: { standard: 일반석, first: 특실 }
    currency: KRW
    # 사이트의 교통비 요금표에 같은 구간·같은 요금의 기차 항목이 있으면 그 항목을 고른 것으로 잇는다(tr_trseq).
    # 없으면 요금만 적고 잇지 않는다.
    link_site_fee: true

# ---------------------------------------------------------------- 숙박비(사후정산)
# 숙박비 상한액(1일)은 사이트가 준다(여비계산서의 CalMaxLodge — 2026-10-03 국내 120,000원). 여기 적는 것은 **상한액을 넘었을 때**의 규칙이다.
# 실제 금액이 상한액을 넘으면 상한액으로 정산할지 실제 금액으로 정산할지 사람이 고른다(2026-10-03 사용자 지정).
lodging:
  over_cap:
    # 상한액의 이 배수까지는 approver 의 승인을 받아 실제 금액으로 정산한다("상한액의 1.5배는 부서장 승인" — 2026-10-05 사용자 지정).
    # 고르는 자리(패널의 출장 카드·홈 카드의 출장 줄)가 이 범위 안인지 밖인지와 누구의 승인이 필요한지를 같이 적는다.
    # 배수를 넘는 금액을 어떻게 정산하는지는 듣지 못했다 — 범위를 벗어난다고만 적고 고르는 것은 막지 않는다.
    approve_rate: 1.5
    approver: 부서장
    # 정산금액이 상한액을 넘으면(실제 금액으로 정산) 숙박 줄의 **비고에 상한 초과 사유가 필수**다(2026-10-08 사용자 지정:
    # "상한액 넘어 가면 '비고' 란에 상한 이유를 넣어야 하거든. 이게 상한액 넘어 가면 필수라서"). 기본 문구가 이것이고,
    # 올리기 전에 패널의 출장 카드에서, 올린 뒤에는 숙박비 내역에서 고쳐 쓸 수 있다. 상한액으로 정산하면 적지 않는다.
    reason: 인근 숙소비 상승으로 인해 숙박비 내에 숙박이 어려움
    source: 사용자 지정(2026-10-05) — 규정 원문은 확인하지 못함
    checked: null
