  <text x="120" y="1140" class="small" fill="#7e57c2">분리 구도:  /rnd-kr-extract (스냅샷) → rnd-manpower-change (변경안) → /rnd-kr-history (이력).  이 스킬은 변경안만 만들고 스냅샷·이력은 직접 수정하지 않는다.</text>
