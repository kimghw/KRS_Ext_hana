# ==========================================================================
# rnd-kr-extract — 구조화 추출 필드 정책 (reference / SSOT)
# --------------------------------------------------------------------------
#  "무엇을 넣고(include) 뺄지(exclude)" 를 여기서만 결정한다.
#  /rnd-kr-extract --format structured 가 이 파일을 읽어 KR 연구개발 내용·예산을
#  YAML(/JSON) 로 구조화한다. 섹션·필드를 켜고 끄려면 enable / fields.<키> 와
#  include/exclude 목록을 고친다(본문 임의 가감 금지 — 이 파일이 단일 출처).
#  값의 "모양"(스키마)·예시는 references/structured_output.md 참조.
# ==========================================================================

version: 1
target: "한국선급(KR)"            # 추출 주체(고정) — KR 행/블록만 대상
unit_default: "천원"             # 금액 단위 기본값(예산)
year_only: true                  # 연차 폴더(<차년도>\) 스냅샷은 '당해 차년도 행만'(2026-10-06). 집행·검증 = scripts/year_slice.py
                                 #   (텍스트 슬라이스·주석 보존·데이터 필터 교차검증, --check 로 타 연차 잔존 시 exit 2). meta 는 슬라이스 대상 아님.

sections:

  # ── 연구개발 내용 (원본 02장: 목표 및 내용) ────────────────────────────
  연구개발내용:
    enable: true
    source_chapter_keywords: ["목표 및 내용", "목표및내용", "2장", "02"]
    fields:                       # 하위 블록 on/off (계층의 하위)
      목표:        true           # ① 연차별 개발목표 + ② 개발내용·범위(R&R)
      성능목표:    true           # 2-1 정량 성능목표(평가항목·연차별 목표치·평가방법)
      성과지표:    true           # 2-1 성과지표(논문 등 KPI)
      수행일정:    true           # 2-3 연차별 수행일정(기간[주])
      주요결과물:  true           # 2-3 연차별 주요 결과물
    include:                      # 넣을 것(정책 설명 — 사람이 읽는 근거)
      - "KR(공동연구개발기관2 / 한국선급) 블록·행만"
      - "연차 구분을 키로 보존(계획축)하되 당해 차년도(output.stage) 행만 — 타 연차 계획값은 그 연차 폴더 스냅샷(year_only)"
      - "개발목표 항목 + 개발내용·범위의 세부 불릿(R&R)"
      - "정량 성능목표: 평가항목·단위·연차별 목표치·평가방법·인증기준"
      - "성과지표: 지표명·당해 연차 목표·가중치(연차 키 맵의 `계`·타 연차 키는 year_only 로 제거. 연차 키가 없는 과제 통합표 `{계: N}` 만 그대로)"
      - "수행일정: 개발내용·기간(주)·착수~종료월(판독 가능 시)"
      - "주요결과물: 연차별 산출물명"
    exclude:                      # 뺄 것
      - "그림/도식 캡션·이미지 설명([그림: ...], <캡션>) — 데이터 값 아님"
      - "타 기관(주관기관·공동연구개발기관1 등) 행·블록"
      - "필요성·배경 등 서술형 산문(02장 외 맥락)"
      - "표 각주·계산식 설명(1) 2) … 윗첨자 주석)"
      - "타 연차 행·타 연차 목표치 키(당해 차년도 외) — scripts/year_slice.py 가 잘라내고 --check 로 검증(year_only)"

  # ── 예산 (원본 08장: 연구개발비 사용계획) ──────────────────────────────
  예산:
    enable: true
    source_chapter_keywords: ["연구개발비", "8장", "08", "안전관리비 계상", "안전 및 보안조치", "6장", "06"]  # 08장(금액) + 06장(연구실안전관리비 계상근거)
    fields:
      지원부담:        true       # 8-1 정부지원/기관부담 현금·현물·합계
      비목별:          true       # 8-2 총괄표(직접비 비목별·간접비·총액)
      외주용역:        true       # 8-3 (3) 연구활동비(외주용역비)
      세부사용계획:    true       # 8-3 (3-1) 연구활동비 항목별 명세
      간접비세부:      true       # 8-3 (4) 간접비 세부
      참여연구자인건비: true      # 8-2 인건비 현황표(개인 계상) — 개인정보 주의(options 참조). 성명·급여총액·참여기간_개월·계상률·계상인건비 (+월별 참여율 표 있으면 월별참여율)
      연구실안전관리비: true      # 연구실 안전관리비 — 06장 계상근거·용도 + 08장 간접비세부의 안전관리비 금액(연차별)
    include:
      - "연차별·비목별 금액(천원). 비목 경로는 '직접비/인건비' 형태로 계층 보존 — 당해 차년도 행만(year_only)"
      - "지원·부담: 정부지원 현금, 기관부담 현금/현물, 합계"
      - "비목별 총괄: 인건비·연구시설장비비·연구재료비·연구활동비·연구수당·간접비·총액"
      - "외주용역: 용역명·용역내용·소요비용·용역기간·결과물"
      - "세부 사용계획: 명칭(구분)·방식·수량·소요비용·사용기간"
      - "참여연구자: 성명·직위·구분·급여총액·참여기간_개월·계상률·계상인건비. 원문에 월별 참여율 표가 있으면 월별참여율 {YYYY-MM: %}(monthly_rate=true) — 정본. 없으면 생략(/rnd-kr-history 가 계상률로 평탄 도출)"
      - "합계 행(연구개발비 총액 M, 직접비 소계 K, 간접비 L)"
      - "연구실안전관리비: 06장 안전관리비 계상의 용도·근거(교육·훈련, 안전환경관리자 전문교육, 설비 설치·유지·보수, 보호장비 구입, 그 밖의 고시 용도)와 계상기준(통상 인건비 총액의 1~2%) + 08장 간접비세부의 연차별 연구실 안전관리비 금액"
    exclude:
      - "비율(%) 열·계산식 각주(연구수당 비율, 간접비 비율 등) — 금액만 보존. 단 참여연구자 계상률(%)·월별참여율(%)은 참여율이므로 보존(예외)"
      - "전 연차 0원인 비목 행(options.keep_zero_rows=false 일 때)"
      - "타 기관(주관·공동1) 예산 표"
      - "타 연차 행(당해 차년도 외) — year_only. 당해 연차분이 원문에 없는 블록(예: 후속 연차 개인별 인건비)은 명시적 빈 블록(연차·참여자 []·소계 null)으로 남김"
    options:
      keep_zero_rows: false        # true 면 전 연차 0원 비목 행도 보존
      mask_personal_salary: false  # true 면 참여연구자 '급여총액(A)' 마스킹, 계상 인건비만 남김
      monthly_rate: true           # true 면 원문에 월별 참여율 표가 있을 때 참여자.월별참여율 {YYYY-MM:%} 으로 추출(정본). 표 없으면 생략(history 가 계상률로 평탄 도출)

# ── 메타(항상 포함) ───────────────────────────────────────────────────────
meta:
  include: [과제명, 수행기관, 단계, 차년도, 연차범위, 연차별기간, 기간, source, rev, 표지]
  notes:
    - "차년도 = 이 스냅샷의 당해 차년도(연차 폴더명과 동일, year_only 기준). 연차범위·연차별기간은 과제 식별정보라 전 연차 유지(슬라이스 대상 아님)"
    - "수행기관 = 한국선급(KR) 고정"
    - "source = 원본 입력 파일명(이력 연계용)"
    - "rev = history 연계 개정 id(있으면). 구조화 결과는 해당 rev 의 '현재값 전량 스냅샷'"

  # ── meta.표지 — 문서 표지(원본 00장: 표지·요약문·목차)의 과제 식별정보 ──────
  #  KR-only 원칙의 '예외' 블록: 과제 식별을 위해 전 기관 공통 필드(주관기관·총액)를 담는다.
  #  출처는 KR 발췌본이 아니라 전체 변환본 00장(original/00_표지_요약문_목차.md).
  #  값의 모양(스키마)은 references/structured_output.md 의 meta.표지 참조.
  표지:
    enable: true                  # false 면 meta.표지 키 자체 생략
    source: "original/00_표지_요약문_목차.md"   # 전체 변환본 00장(발췌본 아님)
    source_chapter_keywords: ["표지", "요약문", "목차", "연구개발계획서", "00", "0장"]
    include:                      # 넣을 것 — 표지 첫 장의 식별 필드
      - "중앙행정기관·전문기관(전담기관) — 원문 표기 그대로"
      - "사업명: 세부사업·내역사업 구분({세부, 내역})"
      - "연구개발과제번호(과제고유번호, 예: RS-2026-xxxxxxxx)"
      - "주관연구개발기관: {기관명, 기관유형}"
      - "총연구개발비 = 표지 연구개발비 표 합계행(전 기관 합산): 정부지원_현금·기관부담_현금·기관부담_현물·합계(천원)"
      - "KR = 공동연구개발기관 표의 '한국선급' 행: {역할, 기관유형, 책임자, 직위} 그대로"
    exclude:                      # 뺄 것
      - "KR 외 공동연구개발기관 행(주관기관 제외 나머지 참여기관 명단) — 식별에 불필요"
      - "요약문 본문·목차 항목(표지 식별정보 외 서술·목차)"
    notes:
      - "표지는 과제 '식별정보'라 KR-only 예외(전 기관 공통 필드 포함). 단 공동기관 상세는 KR 행만."
      - "총연구개발비(합계)는 전 과제(전 기관) 합계 — 예산.지원부담(KR 한정)과 다른 값이므로 혼동 주의."
      - "책임자 성명이 원문 오타로 이메일 등과 불일치하면 무손실 주석으로 보존(예: 원문 '김거하' → '김거화')."
      - "금액은 수치 타입(쉼표·'천원' 제거). 판독 불가·해당없음은 null."

# ── 이력(/rnd-kr-history) 매칭 ─────────────────────────────────────────────
#  변경이력은 별도 스킬 /rnd-kr-history 가 이 구조화 스냅샷을 입력으로 처리한다.
#  /rnd-kr-history 의 track 을 충족하려면 아래 필드를 켜 둬야 한다(끄면 그 엔티티 추적 불가):
#    budget       ← sections.예산.fields.비목별 (+ 외주용역)
#    researchers  ← sections.예산.fields.참여연구자인건비
#    objectives   ← sections.연구개발내용.fields.성능목표
#  상세 매칭·item 스키마: ../../rnd-kr-history/references/history_schema.md
history_matching:
  budget:       [예산.비목별, 예산.외주용역]
  researchers:  [예산.참여연구자인건비]
  objectives:   [연구개발내용.성능목표]
