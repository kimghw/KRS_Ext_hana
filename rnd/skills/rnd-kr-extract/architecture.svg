  <text x="120" y="1298" class="small" fill="#7e57c2">파이프라인: 입력 판별 → 수집 → 과제명 → 전체 변환 → KR 매핑 → KR 발췌 → [markdown 결합 | structured 정규화 → 차년도 슬라이스 → r0 init] → 정리 → 검증.  값의 정본 = 발췌본 · 이후 변경 이력은 /rnd-kr-history.</text>
