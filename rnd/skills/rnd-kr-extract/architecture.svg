    <text x="900" y="1223" class="small" fill="#4527a0">· 이후 변경비교 YAML(참여연구자인건비_변경비교) 등으로</text>
    <text x="900" y="1238" class="small" fill="#4527a0">  r1+ 누적은 /rnd-kr-history 소관 (diff·changelog·뷰)</text>
