# 참여연구원 이력 (sparse hybrid — 변경분만 중첩)
# item key = (성명, 단계, 연차)
# 참여율 = 세 값(모두 "값"=도메인, rev 는 "이력축" — 섞지 말 것) · 계산은 rerp(회사 시스템) 기준:
#   · 연평균참여율   = round(계상인건비/급여총액×100, 2)  ← 정의식(금액 기준)이 정본. 헤드라인
#   · 참여기간참여율 = 계상률 = rerp 최종 계상률 = ceil2(계상인건비/(월급여×개월)×100)  (총 지급한도 대비 지급금액 비율 — 월 참여율 평균 아님)
#   · 월별참여율     = 참여기간 각 월의 % 맵 {YYYY-MM:%}(매월). 정본 우선: ①변경비교 YAML 월별인건비[].참여율(실측) ②스냅샷 월별참여율 ③평탄 도출
#   · 급여총액       = 연봉(12개월) 기준 연간 총액(천원). 월급여 = 급여총액/12 천원 절삭(rerp) — 함께 적재하면 snapshot 재생성 무손실
#   · 정합(rerp): 참여기간참여율 = ceil2(인건비/(월급여×개월)) · 연평균 = 인건비/급여총액. 월별참여율은 표시·대사용. ⚠ 구식 (급여총액/12)×개월×률 재계산은 rerp 절삭·잔액 배분과 어긋날 수 있음(참고만)
#   · 하위호환: 기존 `참여율` 키는 참여기간참여율(=계상률)로 읽음. 급여총액 없는 옛 이력은 재생성 시 역산(⚠). 신규 적재는 연평균·참여기간참여율·급여총액(+필요 시 월별참여율)
# 현재 상태 = 항목 최상위 / 하차·교체 = 최상위 status: 제외 + history 기록
entity: researchers
