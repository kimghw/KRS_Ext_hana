# rnd-export-latest 설정 — 빈 양식(instruction template, ③ 양식·지침)
# ─────────────────────────────────────────────────────────────────────────
# 사용법: 이 파일을 **같은 폴더**(스킬 안 = 양식 옆)에 export.config.yaml 로 복사해 값을 채운다(2026-07-02 doctrine).
#   (PowerShell)  Copy-Item .claude/skills/rnd-export-latest/export.config.tpl.yaml .claude/skills/rnd-export-latest/export.config.yaml
#   (bash)        cp .claude/skills/rnd-export-latest/export.config.tpl.yaml .claude/skills/rnd-export-latest/export.config.yaml
# 복사 후 이 머리 주석 전체(③ 양식 라벨~값 규칙)를 실값용 포인터 헤더(아래 1줄 + 필요 시 백업 경고)로 교체:
#   "# 스키마·작성지침(빈 양식) → 같은 폴더 export.config.tpl.yaml"
# 실값 export.config.yaml 은 머신별 경로라 git·toolkit 공유에서 제외된다(.gitignore·.toolignore). 이 .tpl 만 커밋.
# ⚠ 스킬 폴더를 덮어쓰는 작업(toolkit pull·재설치) 전에는 실값 백업.
# 우선순위: CLI 인자 > export.config.yaml > 내장 기본. (이 파일이 없어도 스크립트는 현행대로 동작)
# 탐색: --config <경로> > <스킬폴더>/export.config.yaml > <프로젝트루트>/export.config.yaml(구위치·하위호환) > <cwd>/export.config.yaml
# 값 규칙: dest/source 는 문자열, with_json/no_overwrite/with_meta 는 true/false 를 따옴표 없이.
#          타입이 다르면(예: "false" 따옴표 문자열) 경고 후 그 키만 무시된다.
#          상대경로 dest/source 는 실행 위치가 아니라 '이 설정파일이 있는 폴더' 기준.

dest:               # ① 복사 목적지(절대/상대 — 상대면 설정파일 위치 기준). 비우거나 생략하면 <source>/_export. 예: "D:/배포/최신스냅샷". 소스 과제 트리 내부 경로는 거부됨(_ 접두 폴더만 허용)
source:             # ① 스캔 소스 루트(보통 비움=자동: 스크립트 기준 프로젝트의 RND_PROJECT). 예: "D:/work/RND/RND_PROJECT"
with_json: false    # ① .json 사본도 함께 복사할지(짝이 되는 KR_*.json 있을 때). true 로 고정했어도 일회성 해제는 --no-json
no_overwrite: false # ① 대상에 동일명 사본이 있으면 스킵할지(false=덮어씀). true 로 고정했어도 일회성 덮어쓰기는 --overwrite
with_meta: true     # ① _export/ea_meta.yaml(과제 운영메타)을 함께 유지·수출 과제 중 없는 것만 빈칸 stub 자동추가(기본 true). 마스터=<source>/_export/ea_meta.yaml(없으면 dest 기존본 seed). 채워진 값·주석은 안 건드림. 일회성 끄기 --no-meta
# 참고: --dry-run(미리보기)은 일회성이라 설정파일에 담지 않는다(항상 CLI 로만).
